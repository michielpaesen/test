function ext(f){const m=/\.([a-z0-9]+)$/i.exec(f);return m?m[1].toLowerCase():"";}
function block(b){
  switch(b[0]){
    case "h": return `<h3>${esc(b[1])}</h3>`;
    case "h2": return `<h2>${esc(b[1])}</h2>`;
    case "p": return `<div class="prose"><p>${esc(b[1])}</p></div>`;
    case "ul": return `<div class="prose"><ul>${b[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
    case "ol": return `<div class="prose"><ol>${b[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
    case "html": return `<div class="docbody">${b[1]}</div>`;
    case "attn": return `<div class="attn">${esc(b[1])}</div>`;
    case "img": return `<div class="figure">${img(b[1])}</div>`;
    case "links": return `<div class="linklist">${b[1].map(([l,to])=>to&&/^https?:/.test(to)?`<a class="pill" href="${esc(to)}" target="_blank" rel="noopener">${esc(l)}</a>`:to&&to.startsWith("docs/")?`<a class="pill dl" href="${esc(to)}" download>${esc(l)}</a>`:to&&PAGES[to]?`<a class="pill" href="#${to}">${esc(l)}</a>`:`<span class="pill off" title="Nog geen pagina">${esc(l)}</span>`).join("")}</div>`;
    case "v": {
      const [,label,file,drive]=b;
      const yt = drive && /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/.exec(drive);
      if(yt) return `<div class="media"><div class="frame"><iframe src="https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="${esc(label)}"></iframe></div><div class="meta"><b>${esc(label)}</b>${SPEED}<a href="https://youtu.be/${yt[1]}" target="_blank" rel="noopener">Open op YouTube</a></div></div>`;
      const local = drive && drive.startsWith("video/");
      if(local) return `<div class="media"><div class="frame"><video src="${esc(drive)}" controls preload="metadata" playsinline></video></div><div class="meta"><b>${esc(label)}</b>${SPEED}</div></div>`;
      const frame = drive && !framed
        ? `<iframe src="https://drive.google.com/file/d/${esc(drive)}/preview" allow="autoplay" allowfullscreen title="${esc(label)}"></iframe>`
        : PLAY;
      const act = drive ? `<a href="https://drive.google.com/file/d/${esc(drive)}/view" target="_blank" rel="noopener">Bekijk video op Drive</a>` : `<span>Video nog te koppelen</span>`;
      return `<div class="media"><div class="frame">${frame}</div><div class="meta"><b>${esc(label)}</b><span>${esc(file)}</span>${act}</div></div>`;
    }
    case "f": {
      const [,label,file,drive,bekijk]=b;
      const pdf = drive && /\.pdf$/i.test(drive);
      const view = bekijk ? ((PAGES[bekijk]||ALIAS[bekijk]) ? "#"+bekijk : bekijk) : (pdf ? drive : "");
      const act = drive && drive.startsWith("docs/")
        ? `<div class="docbtns">${view?`<a class="btn" href="${esc(view)}"${view.startsWith("#")?"":' target="_blank" rel="noopener"'}>Bekijken</a>`:""}<a class="btn" href="${esc(drive)}" download>Downloaden</a></div>`
        : drive ? `<a href="https://drive.google.com/file/d/${esc(drive)}/view" target="_blank" rel="noopener">Openen</a>` : `<span>Bestand nog te koppelen</span>`;
      return `<div class="media doc"><div class="ico">${esc(ext(file)||"doc")}</div><div class="meta"><b>${esc(label)}</b><span>${esc(file)}</span>${act}</div></div>`;
    }
    case "s": return `<div class="media doc"><div class="ico">sheet</div><div class="meta"><b>${esc(b[1])}</b><span>Google Spreadsheet</span><a href="https://drive.google.com/open?id=${esc(b[2])}" target="_blank" rel="noopener">Openen in Google Sheets</a></div></div>`;
  }
  return "";
}
function renderBlocks(list){
  // opeenvolgende video's/bestanden samen in een raster (video's: 2 per rij)
  let out="",buf=[],vid=false;
  const flush=()=>{if(buf.length){out+=`<div class="grid${vid?" vids":""}">${buf.join("")}</div>`;buf=[];vid=false;}};
  for(const b of list){ if(["v","f","s"].includes(b[0])){ buf.push(block(b)); if(b[0]==="v") vid=true; } else {flush(); out+=block(b);} }
  flush(); return out;
}
function renderHome(){
  const years=[["3","3de-jaar"],["4","4de-jaar"],["5","5de-jaar"],["6","6de-jaar"]];
  return `<section class="hero">${IM.hero?img("hero","",true):""}<div class="txt"><h1>Website Sportwetenschappen</h1><p>Oefeningen, demo's, prestatietabellen en afspraken voor het 3de tot 6de jaar sportwetenschappen.</p></div></section>
  <h2>Kies je jaar</h2>
  <div class="years">${years.map(([n,id])=>id?`<a class="year" href="#${id}"><b>${n}</b><span>${n}SPW</span></a>`:`<div class="year off"><b>${n}</b><span>${n}SPW · binnenkort</span></div>`).join("")}</div>
  <h2>Per sport</h2>
  <div class="sports">${SPORTS.map(([name,key,yrs])=>`<article class="sport"><div class="pic">${key?img(key,name,true):""}</div><div class="body"><h2>${esc(name)}</h2><div class="chips">${yrs.length?yrs.map(([l,to])=>to?`<a class="chip" href="#${to}">${esc(l)}</a>`:`<span class="chip off">${esc(l)}</span>`).join(""):`<span class="chip off">nog geen pagina's</span>`}</div></div></article>`).join("")}</div>`;
}
function renderPage(id){
  const p=PAGES[id]; const t=trail(id);
  const crumbs=t.slice(0,-1).map(x=>`<a href="#${x.id}">${esc(x.m)}</a><span>›</span>`).join("");
  let body=renderBlocks(p.c);
  const sub=kids(id);
  if(!p.c.some(b=>b[0]==="links") && sub.length) body+=`<div class="linklist">${sub.map(k=>`<a class="pill" href="#${k.id}">${esc(k.m)}</a>`).join("")}</div>`;
  if(!body) body=`<p class="empty">Deze pagina heeft nog geen inhoud.</p>`;
  return `<nav class="crumbs" aria-label="Kruimelpad">${crumbs}</nav><h1>${esc(p.t)}</h1>${body}`;
}
function renderTree(cur){
  const open=new Set(trail(cur).map(x=>x.id));
  const ul=(pid,lvl)=>{const k=kids(pid);if(!k.length)return"";return `<ul class="lvl${lvl}">${k.map(x=>`<li><a href="#${x.id}" class="${x.id===cur?"on":""}">${esc(x.m)}</a>${(open.has(x.id)||lvl===0&&false)?ul(x.id,lvl+1):""}</li>`).join("")}</ul>`;};
  document.getElementById("treeBody").innerHTML=`<ul class="lvl0"><li><a href="#home" class="${cur==="home"?"on":""}">Home</a></li></ul>`+ul("home",0);
}
function renderTopnav(cur){
  const top=trail(cur)[1]?.id;
  document.getElementById("topnav").innerHTML=[["home","Home"],["3de-jaar","3SPW"],["4de-jaar","4SPW"],["5de-jaar","5SPW"],["6de-jaar","6SPW"]]
    .map(([id,l])=>`<a href="#${id}" class="${(id===top||(id==="home"&&cur==="home"))?"on":""}">${l}</a>`).join("");
}
const ALIAS={"atl3-prest":"atl3","g5-b1-handstand":"g5-b1-grond","g5-b1-rondat":"g5-b1-grond","g5-b1-rondatsprong":"g5-b1-sprong","g5-b1-zolendraai":"g5-b1-rekstok","g5-b1-overslag":"g5-b2-grond","g5-b1-handstandoverslag":"g5-b2-sprong"};
/* Remediëring zwemmen per jaar: kopieer de pagina's z-rem en alles eronder naar elk jaar (id + "-3", "-4", ...) */
const REMJAREN=[3,4,5,6];
(()=>{
  const onder=p=>{for(let x=p;x;x=PAGES[x.p]) if(x.id==="z-rem") return true; return false;};
  const basis=Object.values(PAGES).filter(onder), ids=new Set(basis.map(p=>p.id));
  const zet=(c,j)=>c.map(b=>b[0]==="links"?["links",b[1].map(([l,to])=>ids.has(to)?[l,to+"-"+j]:[l,to])]:b);
  basis.forEach(p=>delete PAGES[p.id]);
  for(const j of REMJAREN){
    for(const p of basis){ const id=p.id+"-"+j; PAGES[id]={...p,id,p:p.id==="z-rem"?"zwem"+j:p.p+"-"+j,c:zet(p.c,j)}; }
    const z=PAGES["zwem"+j]; if(z) z.c=zet(z.c,j);
  }
  basis.forEach(p=>{ ALIAS[p.id]=p.id+"-3"; });
})();
function route(){
  let id=decodeURIComponent(location.hash.slice(1))||"home";
  id=ALIAS[id]||id;   // oude pagina-adressen doorsturen
  if(!PAGES[id]) id="home";
  document.getElementById("main").innerHTML = id==="home"?renderHome():renderPage(id);
  renderTree(id); renderTopnav(id);
  document.title = id==="home"?"Website Sportwetenschappen":`${PAGES[id].t} · Website Sportwetenschappen`;
  document.getElementById("tree").classList.remove("open");
  document.getElementById("treeToggle").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
/* snelheidsknoppen: eigen video's via playbackRate, YouTube via de IFrame-API (postMessage) */
const ytSend=(f,cmd,args)=>f.contentWindow&&f.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args||[]}),"*");
document.addEventListener("click",e=>{
  const btn=e.target.closest(".speed button"); if(!btn) return;
  const media=btn.closest(".media"), r=parseFloat(btn.dataset.r);
  media.querySelectorAll(".speed button").forEach(x=>x.classList.toggle("on",x===btn));
  const v=media.querySelector("video"), f=media.querySelector("iframe");
  if(v) v.playbackRate=r;
  if(f){ f.dataset.rate=r; ytSend(f,"setPlaybackRate",[r]); }
});
// YouTube negeert de snelheid soms vóór het afspelen: opnieuw instellen zodra de video start
document.addEventListener("load",e=>{ const f=e.target; if(f.tagName==="IFRAME"&&f.src.includes("enablejsapi")) f.contentWindow.postMessage(JSON.stringify({event:"listening"}),"*"); },true);
window.addEventListener("message",e=>{
  let host; try{ host=new URL(e.origin).hostname; }catch(_){ return; }
  if(!/youtube(-nocookie)?\.com$/.test(host)) return;
  let d; try{ d=JSON.parse(e.data); }catch(_){ return; }
  const f=[...document.querySelectorAll("iframe[data-rate]")].find(x=>x.contentWindow===e.source);
  if(f && d.info && d.info.playerState===1 && d.info.playbackRate!==+f.dataset.rate) ytSend(f,"setPlaybackRate",[+f.dataset.rate]);
});
document.getElementById("treeToggle").addEventListener("click",e=>{
  const t=document.getElementById("tree"); t.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded",t.classList.contains("open"));
});
/* zoeken */
const zoek=document.getElementById("zoek"), res=document.getElementById("results");
zoek.addEventListener("input",()=>{
  const q=zoek.value.trim().toLowerCase();
  if(q.length<2){res.hidden=true;return;}
  const hits=Object.values(PAGES).filter(p=>p.id!=="home"&&(p.t+" "+p.m+" "+JSON.stringify(p.c)).toLowerCase().includes(q)).slice(0,30);
  res.innerHTML=hits.length?hits.map(p=>`<a href="#${p.id}">${esc(p.t)}<small>${trail(p.id).slice(1,-1).map(x=>esc(x.m)).join(" › ")}</small></a>`).join(""):`<a>Niets gevonden voor “${esc(q)}”</a>`;
  res.hidden=false;
});
res.addEventListener("click",()=>{res.hidden=true;zoek.value="";});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true;});
route();
</script>
</body></html>
