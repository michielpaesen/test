pg("doc-klimmen-klimmen-les-1","klimmen","Klimmen les 1",[F("Klimmen les 1","klimmen les 1.docx","docs/klimmen/klimmen_les_1.docx"),["html","<p><strong>Klimmen: les 1</strong></p>\n<p><strong>Intro:</strong></p>\n<p><strong>Opwarming:</strong></p>\n<p><u>Kat en muis:</u></p>\n<ul>\n<li><p>groepjes van 4 (1 kat, 3 muizen)</p></li>\n<li><p>muizen op de muur</p></li>\n<li><p>kat op de zone tussen muur en kegels</p></li>\n<li><p>doel:</p>\n<ul>\n<li><p>De muizen proberen de kegels te tikken en wie het eerst 5 punten heeft, wint.</p></li>\n<li><p>De kat probeert de muizen te tikken, indien ze een muis tikt, wordt deze kat en verliest zij al haar punten.</p></li>\n</ul></li>\n</ul>\n<blockquote>\n<p><em>Materiaal:</em> kegels</p>\n</blockquote>\n<p><strong>Kern:</strong></p>\n<p><u>Doorschuifoefeningen op technische principes:</u></p>\n<ol type=\"1\">\n<li><p><u>‘Simon says’ (evenwicht):</u></p>\n<p>De leerlingen hangen aan de muur, de L geeft bevelen: linkerhand los, rechtervoet los, links op groen, … Wie eraf valt of de voet of een fout maakt, wordt de nieuw Simon.</p>\n<p><em>Materiaal:</em> /</p></li>\n<li><p><u>Cirkels (evenwicht + voetplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Er staan cirkels op de muur getekend. De leerlingen proberen volledig in de cirkel te geraken, de cirkel te verbergen met hun lichaam door grepen rond de cirkel te gebruiken.</p>\n<p><em>Materiaal:</em> dikke elastieken met touw erdoor</p>\n</blockquote>\n<ol start=\"3\" type=\"1\">\n<li><p><u>Blind klimmen (evenwicht + voetplaatsing + verplaatsing + beheersing + vertrouwen + muur lezen):</u></p></li>\n</ol>\n<ul>\n<li><p>Geblinddoekt de andere blinddoek die aan de muur hangt zoeken in een cirkel rond je zonder verplaatsing of commando’s van de partner. (blinddoek pas hangen nadat de klimmer geblinddoekt aan de muur hangt!)</p></li>\n<li><p>Een parcours geblinddoekt afleggen van punt A naar punt B op commando van de partner.</p></li>\n<li><p>Een parcours geblinddoekt afleggen van punt A naar punt B nadat je het eerst zonder blinddoek geklommen hebt, maar zonder commando’s van de partner. (memorisatie)</p></li>\n</ul>\n<blockquote>\n<p><em>Materiaal:</em> 2 blinddoeken</p>\n</blockquote>\n<ol start=\"4\" type=\"1\">\n<li><p><u>Binnen/buiten de lijnen traverseren (evenwicht + voetplaatsing + verplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Van het begin van de lijnen op de muur tot voorbij de aankomstlijn klimmen, waarbij je enkel grepen binnen of buiten de schuine lijnen op de muur gebruikt.</p>\n</blockquote>\n<p><em>Materiaal:</em> 6 dikke elastieken met telkens een stuk touw tussen 2 elastieken</p>\n<ol start=\"5\" type=\"1\">\n<li><p><u>Zijwaarts traverseren (evenwicht + voetplaatsing + verplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Van punt A naar punt B traverseren, maar altijd zijwaarts tov de muur staan.</p>\n<p><em>Materiaal:</em> /</p>\n</blockquote>\n<ol start=\"6\" type=\"1\">\n<li><p><u>Grote passen ⬄ kleine passen (evenwicht + voetplaatsing + verplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Van punt A naar punt B traverseren, de eerste keer met zo veel mogelijk passen, de volgende keer met zo weinig mogelijk passen.</p>\n<p><em>Materiaal:</em> /</p>\n</blockquote>\n<ol start=\"7\" type=\"1\">\n<li><p><u>Traverseren met toevoegen van passen (memorisatie):</u></p></li>\n</ol>\n<blockquote>\n<p>Leerling 1 start de route met twee voetsteunen, leerling 2 herhaalt de route met die twee zelfde voetsteunen en voegt er twee voetsteunen aan toe, vervolgens klimt leerling 1 opnieuw, herhaalt en voegt op zijn beurt weer twee steunen toe. Er wordt gevorderd tot er 1 leerling mist of van de muur valt.</p>\n<p><em>Materiaal:</em> /</p>\n</blockquote>\n<p><u>Toprope klimmen</u></p>\n<ul>\n<li><p>Uitleg materiaal:</p>\n<ul>\n<li><p>Aandoen klimgordel</p></li>\n<li><p>Hoe zekeren (5-stappen handeling)</p>\n<ul>\n<li><p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image1.jpeg\" /><strong>Basishouding:</strong> 2 handen zijn onder het zekerapparaat en omvatten geheel het klimtouw. Het klimtouw onder het zekerapparaat noemen wij ook wel het 'rem'touw.</p></li>\n</ul></li>\n</ul></li>\n</ul>\n<blockquote>\n<p>De rode hand is de hand die het touw blokkeert</p>\n</blockquote>\n<ul>\n<li><p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image2.jpeg\" /><strong>Stap 1:</strong> 1 hand gaat naar boven het zekerapparaat (ter hoogte van het voorhoofd).</p></li>\n<li><p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image3.jpeg\" /><strong>Stap 2:</strong> De hand onder het zekerapparaat gaat ook omhoog en haalt het touw in, terwijl de hand boven het zekerapparaat een klein beetje duwt.</p></li>\n<li><p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image4.jpeg\" /><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image5.jpeg\" /><strong>Stap 3:</strong> Direct de hand onder het zekerapparaat weer naar beneden brengen 'op de rem' zetten (in de remhouding zetten), alleen met het touw naar beneden gericht kan het zekerapparaat zijn volledig remmende werking behouden ter ondersteuning bij een val.</p></li>\n<li><p><strong>Stap 4:</strong> De hand die boven het zekerapparaat is gaat vlak onder het zekerapparaat weer op het 'rem'touw.</p></li>\n</ul>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image6.jpeg\" /></p>\n<ul>\n<li><p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_1_media/media/image1.jpeg\" /><strong>Stap 5:</strong> De onderste hand sluit aan bij de bovenste hand en je staat direct weer in de basishouding.</p></li>\n</ul>\n<ul>\n<li><p>Inoefenen zekeren met ‘klimmer’ op de grond</p></li>\n<li><p>Inoefenen afdalen op lage hoogte</p></li>\n<li><p>Top rope routes klimmen</p>\n<p>Tips:</p>\n<ul>\n<li><p>Klimmen met gestrekte armen (+ gebruik van borstspier)</p></li>\n<li><p>Klimmen op voorvoet</p></li>\n<li><p>Opduwen op 2 voeten indien mogelijk</p></li>\n<li><p>Gebruik maken van alle grepen (met kleine passen vorderen)</p></li>\n<li><p>De grepen gebruiken zoals ze gehangen zijn (onderhands, zijwaarts, …)</p></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<p>Cooling down, stretchen en opruimen van het materiaal</p>\n"]]);PAGES["doc-klimmen-klimmen-les-1"].doc=true;
pg("doc-klimmen-klimmen-les-2","klimmen","Klimmen les 2",[F("Klimmen les 2","klimmen les 2.docx","docs/klimmen/klimmen_les_2.docx"),["html","<p><strong>Klimmen: les 2</strong></p>\n<p><strong>Opwarming:</strong></p>\n<p><u>Hoog-laag:</u></p>\n<ul>\n<li><p>De leerlingen staan verspreid op de muur en hebben allen 5 elastiekjes op de grond liggen.</p></li>\n<li><p>Boven hen hangt op 4m hoogte een setje</p></li>\n<li><p>De bedoeling is zo snel mogelijk alle 5 de elastiekjes in het setje te hangen.</p>\n<ul>\n<li><p>Doel: klein maken (elastiekjes oprapen) en met gestrekte armen aan de muur leren hangen</p></li>\n<li><p>Doel: groot maken (elastiekjes in setje inpikken) en leren inpikken</p></li>\n</ul></li>\n</ul>\n<p>Zie kijkwijzer 1</p>\n<p><strong>Kern:</strong></p>\n<p><u>Doorschuifoefeningen op technische principes:</u></p>\n<ol type=\"1\">\n<li><p><u>De loodlijn (evenwicht + verplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Per 2 (de partner geeft het signaal als het touw boven de voet hangt)</p>\n<p>De linkervoet mag pas bewegen als het touw boven de rechtervoet hangt. Op deze manier traverseer je van punt A naar B (zelf te bepalen).</p>\n</blockquote>\n<p><em>Materiaal:</em> touw, klein gewichtje (musketon)</p>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Met één hand klimmen (evenwicht + voetplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Per 2 <strong><u>MET TOUW</u></strong> (partner zekert)</p>\n<p>Kies een <u>schuine muur</u> en probeer met 1 hand omhoog te klimmen (vastmaken met touw!)</p>\n<p><em>Materiaal:</em> (eventueel tennisbal om vast te houden (uitdaging), eventueel handschoenen om mee te klimmen (afdaling))</p>\n</blockquote>\n<ol start=\"3\" type=\"1\">\n<li><p><u>Raken is nemen (hand- en voetplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Per 2 (partner controleert of je geraakt hebt)</p>\n<p>Traverseren van punt A naar punt B (zelf te bepalen). Je krijgt 1 punt als je een greep raakt en gebruikt. Je krijgt -2 punten aftrek als je een greep raakt en niet gebruikt.</p>\n<p><em>Materiaal:</em> /</p>\n</blockquote>\n<ol start=\"4\" type=\"1\">\n<li><p><u>Steentjes (voetplaatsing):</u></p></li>\n</ol>\n<blockquote>\n<p>Per 2 (partner raapt afgestoten steentjes op en legt ze terug)</p>\n<p>Traverseren van punt A naar B (zelf te bepalen) met op de voetsteunen kleine steentjes. Elke steun die je goed gebruikt levert 1 punt op, elk steentje dat je afstoot geeft -2 punten aftrek.</p>\n<p><em>Materiaal:</em> kleine steentjes</p>\n</blockquote>\n<ol start=\"5\" type=\"1\">\n<li><p><u>Beentje strek (verplaatsing + evenwicht):</u></p></li>\n</ol>\n<blockquote>\n<p>Per 2 <strong><u>MET TOUW</u></strong> (partner zekert, controleert of been gestrekt is en geeft teken om verder te gaan)</p>\n<p>Je moet het steunbeen volledig uitstrekken voor je het andere been mag zetten en op die manier klim je tot boven.</p>\n<p><em>Materiaal:</em> /</p>\n</blockquote>\n<p><u>Top rope klimmen eigen niveau</u></p>\n<p>Tips:</p>\n<ul>\n<li><p>Eerste 6 voetsteunen zeggen voor je vertrekt (tactisch)</p></li>\n<li><p>Uitleg voetwissel</p></li>\n<li><p>Uitleg overhang (in boulderzaal)</p></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<p>Cooling down, stretchen en opruimen materiaal</p>\n<p><strong><u>Kijkwijzer 1: opwarming hoog-laag</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image1.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Individueel (wedstrijdje in groep tegen elkaar)<br />\n- Neem telkens 1 elastiek op de grond (zonder van de muur te komen!), klim vervolgens terug omhoog en hang het aan de musketon.<br />\n<em>Materiaal:</em> elastiekjes, setje<br />\n<strong><u>Kijkwijzer 2: de loodlijn</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image2.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Per 2 (de partner geeft het signaal als het touw boven de voet hangt)<br />\n- De linkervoet mag pas bewegen als het touw boven de rechtervoet hangt. Op deze manier traverseer je van punt A naar B (zelf te bepalen).<br />\n<em>Materiaal:</em> touw, klein gewichtje (musketon)</p>\n<p><strong><u>Kijkwijzer 3: met 1 hand klimmen</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image3.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Per 2 <strong><u>MET TOUW</u></strong> (partner zekert)<br />\n- Kies een <u>schuine muur</u> en probeer met 1 hand omhoog te klimmen (vastmaken met touw!)<br />\n<em>Materiaal:</em> (eventueel tennisbal om vast te houden, eventueel handschoenen om mee te klimmen)</p>\n<p><strong><u>Kijkwijzer 4: raken is nemen</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image4.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Per 2 (partner controleert of je geraakt hebt)<br />\n- Traverseren van punt A naar punt B (zelf te bepalen). Je krijgt 1 punt als je een greep raakt en gebruikt. Je krijgt -2 punten aftrek als je een greep raakt en niet gebruikt.<br />\n<em>Materiaal:</em> /</p>\n<p><strong><u>Kijkwijzer 5: steentjes</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image5.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Per 2 (partner raapt afgestoten steentjes op en legt ze terug)<br />\n- Traverseren van punt A naar B (zelf te bepalen) met op de voetsteunen kleine steentjes. Elke steun die je goed gebruikt levert 1 punt op, elk steentje dat je afstoot geeft -2 punten aftrek.<br />\n<em>Materiaal:</em> kleine steentjes</p>\n<p><strong><u>Kijkwijzer 6: beentje strek</u></strong></p>\n<p><img loading=\"lazy\" src=\"docs/klimmen/klimmen_les_2_media/media/image6.JPG\" /></p>\n<p><strong>Opdracht:</strong><br />\n- Per 2 <strong><u>MET TOUW</u></strong> (partner zekert, controleert of been gestrekt is en geeft teken om verder te gaan)<br />\n- Je moet het steunbeen volledig uitstrekken voor je het andere been mag zetten en op die manier klim je tot boven.<br />\n<em>Materiaal:</em> /</p>\n"]]);PAGES["doc-klimmen-klimmen-les-2"].doc=true;
pg("doc-klimmen-puntensleutel-muurklimmen-toprope","klimmen","Puntensleutel muurklimmen toprope",[F("Puntensleutel muurklimmen toprope","puntensleutel muurklimmen toprope.xlsx","docs/klimmen/puntensleutel_muurklimmen_toprope.xlsx"),["html","<h2>Blad1</h2><div class=\"tablewrap\"><table><tbody><tr><td>puntensleutel klimmen</td><td></td></tr><tr><td>4a</td><td>9</td></tr><tr><td>4b</td><td>10</td></tr><tr><td>4c</td><td>11</td></tr><tr><td>5a</td><td>12</td></tr><tr><td>5b</td><td>13</td></tr><tr><td>5c</td><td>14</td></tr><tr><td>6a</td><td>15</td></tr><tr><td>6b</td><td>16</td></tr><tr><td>6c</td><td>17</td></tr><tr><td>7a</td><td>18</td></tr><tr><td>7b</td><td>19</td></tr><tr><td>7c</td><td>20</td></tr><tr><td>foute greep of voetsteun gebruiken -0,5 punt per keer</td><td></td></tr><tr><td>blok -1 punt per keer</td><td></td></tr><tr><td>val -1 punt per keer</td><td></td></tr><tr><td>Wanneer je onder aan een nieuwe route start, begin je terug zonder aftrek.</td><td></td></tr><tr><td>Je krijgt x minuten om een zo moeilijk mogelijke route te klimmen. Je mag hierbij dezelfde route opnieuw doen of veranderen van route. Per minuut die je over tijd gaat om een route uit te klimmen, verlies je 1 punt.</td><td></td></tr><tr><td>Er worden 5 punten op techniek gegeven. De aandachtspunten:</td><td></td></tr><tr><td></td><td>* gestrekte armen</td></tr><tr><td></td><td>* gebruik van de benen</td></tr><tr><td></td><td>* voetplaatsing meteen juist</td></tr><tr><td></td><td>* juiste positionering tov de grepen (indraaien waar nodig)</td></tr><tr><td></td><td>* juist lezen van de route</td></tr><tr><td>Bij hoogtevrees krijg je per 2m een strafpunt met een maximum van 3 strafpunten en dus maximaal 6m verlaging vanaf de top. </td><td></td></tr></tbody></table></div><h2>Blad2</h2><div class=\"tablewrap\"><table><tbody><tr><td></td><td>geklommen route</td><td>resultaat</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4a</td><td>4b</td><td>10</td><td>1</td><td>1</td><td>1</td><td>0,5</td><td>1</td><td>14,5</td></tr><tr><td>4b</td><td>4c</td><td>11</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>4c</td><td>5a</td><td>12</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5a</td><td>6c</td><td>17</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5b</td><td>4b</td><td>10</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>5c</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6a</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6b</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>6c</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7a</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7b</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td>7c</td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td>#VALUE!</td><td></td><td></td><td></td><td></td><td></td><td></td></tr><tr><td></td><td>7a</td><td>18</td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody></table></div>"]]);PAGES["doc-klimmen-puntensleutel-muurklimmen-toprope"].doc=true;
pg("doc-padel-lessenreeks-padel","padel","Lessenreeks padel",[F("Lessenreeks padel","lessenreeks padel.docx","docs/padel/lessenreeks_padel.docx"),["html","<p><strong><u>Padel:</u></strong></p>\n<p><strong>Les 1:</strong></p>\n<p><strong>Basisslagen FH en BH</strong></p>\n<p>2<sup>5</sup>’ uitleg:</p>\n<ul>\n<li><p>Aandachtshouding: voeten in richting van de tegenstander, racket heuphoogte</p></li>\n<li><p>Open draaien (pivoteren) – racket achter onder de bal (2 euro)</p></li>\n<li><p>FH: schoendoos vasthouden + klappen – BH: handen samen – armen openen</p></li>\n<li><p>Contactpunt schuin voor</p></li>\n</ul>\n<p><u>Oefenvormen</u> (indien meer dan 4 lln per terrein =&gt; terrein in 3 delen verdelen):</p>\n<p>2<sup>5</sup>’ <strong>individueel tegen het raam</strong> tikken FH+BH</p>\n<p>2<sup>5</sup>’ op 4m van het net naar elkaar tikken <strong>met controle tik</strong></p>\n<p>2<sup>5</sup>’ op 4m van het net naar elkaar tikken <strong>zonder</strong> controle tik</p>\n<p>(2<sup>5</sup>’ idem <strong>diagonaal</strong> =&gt; AH: voetpunten wijzen naar medespeler)</p>\n<p><u>Spelvorm</u> (indien meer dan 4 lln per terrein =&gt; per game de gewonnen speler rust =&gt; max 6 lln):</p>\n<p>5’ <strong>minipadel</strong> wedstijd binnen 4m – geen volley</p>\n<p><strong>Basispositie achteraan + FH en BH</strong></p>\n<p>2<sup>5</sup>’ uitleg:</p>\n<ul>\n<li><p>Kruispunt van snijlijnen van ruiten 1-2 en 3-4</p></li>\n<li><p>AH: idem aan basisslagen: voeten naar de speler met bal</p></li>\n<li><p>techniek FH+BH: idem aan basisslagen</p></li>\n</ul>\n<blockquote>\n<p>TACTIEK: tempo van de bal aanpassen aan de tijd die je nodig hebt om terug naar de basispositie te keren.</p>\n</blockquote>\n<p><u>Oefenvormen</u> (indien meer dan 4 lln per terrein =&gt; terrein in 3 delen verdelen):</p>\n<p>2<sup>5</sup>’ samen de bal in leven houden – bots voor de servicelijn</p>\n<p>2<sup>5</sup>’ idem vorige oefening, maar tussen 2 contacten verplaatsen naar BP - voet tikken op spot</p>\n<p>(2<sup>5</sup>’ idem vorige oefening, maar bij niet tikken of missen wissel met extra speler vanachter)</p>\n<p><u>Spelvorm</u> (indien meer dan 4 lln per terrein – 1 speler midden achter het veld =&gt; max 6 lln):</p>\n<p>5’ padel wedstrijd – alles in het servicevak – wie fout maakt wisselt met speler midden achter</p>\n<p><strong><br />\n</strong></p>\n<p><strong>Gebruik achterwand/glas</strong></p>\n<p>2<sup>5</sup>’ uitleg:</p>\n<ul>\n<li><p>pivoteren (deur openen: racket + voet)</p></li>\n<li><p>aanpassen aan de bal dmv. sidesteps ifv. contactpunt schuin voor het lichaam<br />\n(glas – lichaam – bal)</p></li>\n</ul>\n<blockquote>\n<p>TACTIEK: gebruik de glaswand:</p>\n</blockquote>\n<ul>\n<li><p>je geeft jezelf hierdoor extra tijd</p></li>\n<li><p>bal remt af</p></li>\n<li><p>bal gaat reeds de juiste richting op</p></li>\n</ul>\n<p><u>Oefenvormen</u> (indien meer dan 4 lln per terrein =&gt; terrein in 3 delen verdelen):</p>\n<p>2<sup>5</sup>’ startpositie <strong>reeds gepivoteerd</strong> – <strong>bal aanrollen – over grond</strong> terug slaan <strong>+ wissel!</strong></p>\n<p>(2<sup>5</sup>’ startpositie <strong>richting raam</strong> – <strong>reeds gepivoteerd</strong> – bal <strong>langs achter aanwerpen</strong> – <strong>extra bots</strong> – <strong>slaan</strong> richting raam en terug laten passeren tot bij partner <strong>+ wissel!</strong> )</p>\n<p>2<sup>5</sup>’ startpositie <strong>richting veld</strong> – <strong>reeds gepivoteerd</strong> – bal <strong>langs voor aanwerpen</strong> (bal via grond tegen raam – BH worp) – <strong>extra bots</strong> – naar partner <strong>slaan</strong> <strong>+ wissel!</strong></p>\n<p>2<sup>5</sup>’ startpositie <strong>in AH</strong> – idem vorige oefening</p>\n<p>2<sup>5</sup>’ startpositie <strong>in AH</strong> – idem vorige oefening maar zonder bots na tikken van het raam</p>\n<p>2<sup>5</sup>’ startpositie <strong>in AH</strong> – idem vorige oefening – bal <strong>aanspelen</strong> – met <strong>extra bots</strong></p>\n<p>2<sup>5</sup>’ startpositie <strong>in AH</strong> – idem vorige oefening – <strong>zonder extra bots</strong></p>\n<p>2<sup>5</sup>’ <strong>rally</strong> proberen spelen – <strong>met extra bots</strong></p>\n<p>2<sup>5</sup>’ <strong>rally</strong> proberen spelen – <strong>zonder extra bots</strong></p>\n<p><u>Spelvorm</u> (indien meer dan 4 lln per terrein =&gt; max 6 lln):</p>\n<p>5’ 4 spelers achteraan – <strong>glas gebruiken</strong> in de rally is spelen voor <strong>dubbele punten</strong> – spelen volgens <strong>correcte punten telling</strong>: 15 – 30 – 40 – spel =&gt; nog <strong>geen deuce</strong>!) – ploeg die verliest blijft staan/maakt plaats</p>\n<p><strong>Padel:</strong></p>\n<p><strong>Les 2:</strong></p>\n<p><strong>Herhaling les 1 - opwarming</strong></p>\n<p>5’ minipadel (bal botst binnen de 4m-lijn)</p>\n<p>2<sup>5</sup>’ BH + FH in het achterveld – bal levend houden (hoeveel balcontacten zonder fout?)</p>\n<p>2<sup>5</sup>’ idem vorige oefening BH + FH leveren 1pt op, BH + FH na glas leveren 3ptn op</p>\n<p><strong>Basispositie net + volley</strong></p>\n<p>2<sup>5</sup>’ uitleg:</p>\n<ul>\n<li><p>AH ter hoogte van de borst (+ 2euro)</p></li>\n<li><p>Voeten wijzen naar de tegenstander met bal</p></li>\n<li><p>± 3m van het net</p>\n<p>Volley:</p></li>\n<li><p>Racket laten zien + openen idem FH + BH</p></li>\n<li><p>Bal duwen (2 euro)</p></li>\n<li><p>FH: duim naar het net – lichaam voorwaarts duwen (instappen) – sterker zijn dan de bal</p></li>\n<li><p>BH: rug van de hand naar net – lichaam idem aan FH</p></li>\n</ul>\n<p><u>Oefenvormen</u></p>\n<p>5’ A aan net, B achterveld =&gt; A volley, B doet <strong>tussenin controle tik</strong> (=&gt; A meer tijd voor AH)<br />\n<strong>+ wissel!</strong></p>\n<p>5’ Idem vorige oefening – <strong>zonder controle tik + wissel!</strong></p>\n<p>5’ A speelt <strong>volley rechtdoor</strong> (vak in 2 delen) <strong>+ wissel!</strong></p>\n<p>5’ A speelt volley diep, <strong>B gebruikt glas</strong> (eventueel met controle tik en bots bij A) <strong>+ wissel!</strong></p>\n<p><u>Spelvorm</u></p>\n<p>10’ 2 spelers aan net (1 ploeg) – 2 spelers achter (1 ploeg) =&gt; 2x volley in samenspel, daarna punt uit spelen.</p>\n<p><strong>Lob</strong></p>\n<p>2<sup>5</sup>’ Uitleg:</p>\n<ul>\n<li><p>Pivoteren (idem aan FH/BH)</p></li>\n<li><p>Racket achter en onder de bal brengen met open blad</p></li>\n<li><p>Bal nemen in dalende lijn</p></li>\n<li><p>Bal hoog opwaarts begeleiden</p></li>\n</ul>\n<p>TACTIEK</p>\n<ul>\n<li><p>Hoogte geven aan de bal</p></li>\n<li><p>1<sup>ste</sup> bots achter de servicelijn</p></li>\n<li><p>Lob opvolgen naar het net (lob = aanvallen)</p></li>\n</ul>\n<p>Oefenvormen</p>\n<p>2<sup>5</sup>’ 2 spelers in het achterveld – lob <strong>spelen uit de hand</strong>, opvangen en terugspelen.</p>\n<p>2<sup>5</sup>’ <strong>1 speler aan het net</strong>, 1 in het achterveld – vanuit het achterveld de bal <strong>uit de hand over de netspeler</strong> spelen en <strong>bal volgen naar het net</strong> – <strong>netspeler loopt achteruit</strong>, vangt de bal en speelt uit de hand terug over de netspeler</p>\n<p>5’ idem vorige oefening – gelobde netspeler <strong>speelt laag terug</strong> naar de gevolgde netspeler – <strong>afwerking met 1 volley</strong></p>\n<p>5’ 1 speler aan net, 1 in het achterveld – spelers spelen met elkaar – speler in het achterveld kiest nu zelf wanneer hij de bal lobt – is de lob achter de servicelijn krijgt de achterspeler reeds een punt – vervolgens de rally uitspelen voor een extra punt. Vervolgens wisselen van functie.</p>\n<p><strong>Padel:</strong></p>\n<p><strong>Les 3:</strong></p>\n<p><strong>Herhaling les 1+2 – opwarming</strong></p>\n<p>2<sup>5</sup>’ minipadel FH+BH</p>\n<p>2<sup>5</sup>’ bal levend houden in het achterveld FH+BH</p>\n<p>2<sup>5</sup>’ 1 speler aan het net – partner in achterveld met bal – achterveld speelt lob en volgt op naar netpositie met AH thv. de borst – netspeler loopt achter de bal aan en speelt lob terug</p>\n<p>2<sup>5</sup>’ 1 speler aan het net met bal – partner in het achterveld – netspeler geeft gemakkelijke bal aan achterspeler – achterspeler lobt en volgt op naar net (AH!) – partner loopt naar achter en speelt laag over het net terug – netspeler speelt volley – punt wordt uitgespeeld op half terrein. (indien 6 lln/terrein: Wie punt wint, blijft staan en begint als netspeler met bal)</p>\n<p>Bandeja – hoog contact</p>\n<p>2<sup>5</sup>’ uitleg:</p>\n<ul>\n<li><p>Vanuit AH wegdraaienq</p></li>\n<li><p>Ellenboog hoog</p></li>\n<li><p>Bal onderscheppen + terugduwen</p></li>\n</ul>\n<p>TACTIEK:</p>\n<ul>\n<li><p>Net niet afgeven (na een lob)</p></li>\n<li><p>Tijd hebben om terug aan het net aan te sluiten (bal met lengte spelen + (dubbel) glas geven)</p></li>\n<li><p>Na het hoog contact onmiddellijk opvolgen naar het net</p></li>\n</ul>\n<p>Oefenvormen:</p>\n<p>5’ Een speler start op basispositie achterveld – andere speler start op de servicelijn met bal, gooit bal voor zichzelf op en speelt bandeja – bal opvolgen naar het net en proberen uitspelen – achterspeler probeert te lobben</p>\n<p>5’ Idem vorige oefening, maar bal vertrekt bij speler op basis positie achterveld die start met een lob</p>\n<p>5’ Idem vorige oefening, maar speler die bandeja gaat spelen, vertrekt van aan het net</p>\n<p>5’ Idem maar vanuit de rally</p>\n"]]);PAGES["doc-padel-lessenreeks-padel"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-1","z-crawl","Effectieve leerlijn borstcrawl - les 1",[F("Effectieve leerlijn borstcrawl - les 1","effectieve leerlijn borstcrawl - les 1.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_1.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 1:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>100m schoolslag</p></li>\n<li><p>100m met plankje op rug, benen crawl</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Beginsituatie schetsen</u></p></li>\n</ol>\n<ul>\n<li><p>50m borstcrawl: # slagen tellen</p></li>\n<li><p>50m borstcrawl: op tijd</p>\n<ul>\n<li><p>Doel: bepalen beginsituatie</p></li>\n</ul></li>\n</ul>\n<blockquote>\n<p>Aantal slagen en tijd gaan noteren (pauze)</p>\n</blockquote>\n<ul>\n<li><p>50m borstcrawl: # slagen + tijd (SWOLF-score)</p>\n<ul>\n<li><p>Doel: bepalen beginsituatie</p></li>\n</ul></li>\n</ul>\n<blockquote>\n<p>SWOLF-score noteren (pauze)</p>\n</blockquote>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Stroomlijnen lichaam</u></p></li>\n</ol>\n<ul>\n<li><p>Op het droge:</p></li>\n</ul>\n<ul>\n<li><p>Rechtop staan in pijlhouding – alleen</p></li>\n<li><p>Rechtop staan in pijlhouding – per 2 (mekaar verbeteren)</p></li>\n<li><p>Op de rug op de grond in pijlhouding – per 2 (mekaar verbeteren)</p></li>\n<li><p>Rechtop staan in pijlhouding (rug tegen de muur) – per 2 (mekaar verbeteren)</p>\n<ul>\n<li><p>Doel: zo min mogelijk weerstand in het water</p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>In het water:</p>\n<ul>\n<li><p>Met de voeten afstoten tegen de muur – alleen</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Om ter verst</p></li>\n<li><p>Voorbij een bepaald punt geraken</p></li>\n</ol></li>\n</ul>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/soY03ta17TM\">voorbeeldvideo</a></p>\n<ul>\n<li><p>Torpedo – per 3</p></li>\n</ul></li>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=SeeDnXtCZAM\">voorbeeldvideo</a></p>\n<ul>\n<li><p>Kip aan’t spit – per 3</p></li>\n</ul></li>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=eif4C1RSEgU\">voorbeeldvideo</a></p></li>\n</ul>\n<ul>\n<li><p>Rechtop rondspringen: 90° - 180° - 360° armen langs het lichaam in het ondiepe</p></li>\n</ul>\n<p>armen opwaarts in het ondiepe</p>\n<p>armen langs het lichaam in het diepe</p>\n<p>armen opwaarts in het diepe</p>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-1"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-11","z-crawl","Effectieve leerlijn borstcrawl - les 11",[F("Effectieve leerlijn borstcrawl - les 11","effectieve leerlijn borstcrawl - les 11.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_11.docx"),["html","<p><strong><u>Zwemmen: borstcrawl les 12 (doel: tuimelkeerpunt + intervaltraining)</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p><strong>6 lengtes</strong> trage crawl (doel: hoofd in water houden, niet opheffen) MET tuimelkeerpunt!</p></li>\n<li><p><strong>6 lengtes</strong> trage crawl, op 1/3, 2/3 van het bad tuimelen + tuimelkeerpunt!</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<p><em><u>tuimelkeerpunt</u></em></p>\n<ul>\n<li><p>Herhaling opbouw tuimelkeerpunt (elke oefening wordt 5x uitgevoerd):</p>\n<ul>\n<li><p>Armen <u>achterwaarts zwemmen naar de muur</u>, tuimelen en rugwaarts afstoten in pijlfase</p></li>\n<li><p>3 slagen borstcrawl met <u>achter laten armen bij de laatste slag</u>, tuimelen en rugwaarts afstoten in pijlfase</p></li>\n<li><p>3 slagen borstcrawl met <u>zijwaartse ademhaling bij de laatste slag</u>, tuimelen en rugwaarts afstoten in pijlfase</p></li>\n<li><p>3 slagen borstcrawl met ademhaling bij de laatste slag, tuimelen en <u>roteren naar buik</u> na afstoot in pijlfase, pijlfase aanhouden, 3 armslagen met <u>zijwaartse ademhaling tijdens tweede armslag</u></p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>Tuimelkeerpunt per 2, vlak achter elkaar zonder snelheidsverlies (iedereen 4x voorop)</p></li>\n<li><p>Treintje zwemmen per 3 of 4: ieder neemt 2 lengtes aan 90% voor zijn rekening, er wordt in de voeten gezwommen en vlak achter elkaar gekeerd. Na 50m gaat de voorste aan de kant en sluit terug achteraan aan. (<strong>8 lengtes</strong>)</p></li>\n</ul>\n<p><strong>5 x 75m</strong> – 25m via droge terug wandelen als rustmoment</p>\n<ul>\n<li><p>Met startduik</p></li>\n<li><p>Met tuimelkeerpunt</p></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<p><strong>8 lengtes</strong> rustig uitzwemmen</p>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-11"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-12","z-crawl","Effectieve leerlijn borstcrawl - les 12",[F("Effectieve leerlijn borstcrawl - les 12","effectieve leerlijn borstcrawl - les 12.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_12.docx"),["html","<p><strong><u>Zwemmen: borstcrawl les 12 (doel: foutencorrectie armen + benen)</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p><strong>4 lengtes</strong> superman (doel: hoofd in water houden, niet opheffen) MET tuimelkeerpunt!</p></li>\n<li><p><strong>4 lengtes</strong> trage crawl (doel: hoofd in water houden, niet opheffen) MET tuimelkeerpunt!</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<p><em><u>armen</u></em></p>\n<ul>\n<li><p>Reach: <strong>2 lengtes</strong>: slaap tikken met duim en ver insteken (arm helemaal uitstrekken!)</p></li>\n<li><p>Catch: <strong>2 lengtes</strong>: 1 hand op plankje, andere enkel catch-fase.</p>\n<ul>\n<li><p>Heen linkerhand op plankje</p></li>\n<li><p>Terug rechterhand op plankje</p></li>\n</ul></li>\n<li><p>Push: <strong>2 lengtes</strong>: bij uitduwen polsslag en met duim de dij tikken</p></li>\n<li><p>Recovery: <strong>2 lengtes</strong>: hoge ellenboog, vingers ontspannen door water laten slepen</p>\n<p>(eventueel hier broken arrow indien geforceerd wordt. Broken arrow = arm langzaam naar gestrekte verticale positie brengen, daar een seconde houden, alvorens arm door te laten spietsen naar voor)</p></li>\n</ul>\n<p><em><u>Benen</u></em> (oefeningen met frontale snorkel (en neusknijper) + plankje)</p>\n<ul>\n<li><p><strong>2 lengtes</strong> zwemmen met extreem gestrekte voeten</p></li>\n<li><p><strong>2 lengtes</strong> =&gt; 10 beenslagen – voeten 100% uit het water</p>\n<p>=&gt; 10 beenslagen – enkel hielen uit het water (doel: voelen wat best is (deze))</p>\n<p>=&gt; 10 beenslagen – voeten 0% uit het water</p>\n<p>=&gt; enz.</p></li>\n</ul>\n<p><em><u>Armen + benen</u></em> (oefening met frontale snorkel (en neusknijper))</p>\n<ul>\n<li><p><strong>4 lengtes</strong> armen + benen met frontale snorkel (doel: betere ligging)</p></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<p><strong>8 lengtes</strong> MET tuimelkeerpunt aan 80% (stevig zwemmen maar met reserve)</p>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-12"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-13","z-crawl","Effectieve leerlijn borstcrawl - les 13",[F("Effectieve leerlijn borstcrawl - les 13","effectieve leerlijn borstcrawl - les 13.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_13.docx"),["html","<p><strong><u>Zwemmen: borstcrawl les 13 (doel: foutencorrectie armen + benen)</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p><strong>4 lengtes</strong> trage crawl (doel: hoofd in water houden, niet opheffen) MET tuimelkeerpunt!</p></li>\n<li><p><strong>12 lengtes</strong> stayeren per 3 of 4 MET tuimelkeerpunt! (doel: kort na elkaar keerpunt leren maken)</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<p><em><u>Isolatie van de armen, benen en ademhaling</u></em></p>\n<p>Telkens afwisselend nadruk op armen, benen en ademhaling (3 sets)</p>\n<ul>\n<li><p><strong>4 lengtes</strong> enkel armen (met pull buoy tussen de benen) =&gt; <strong>KEERPUNT!!!</strong></p></li>\n</ul>\n<ul>\n<li><p><strong>4 lengtes</strong> enkel benen (pull buoy voor je <u>MET ZOOMERS</u>) =&gt; <strong>KEERPUNT!!!</strong></p></li>\n<li><p><strong>4 lengtes</strong> ademhaling (pull buoy afwisselend lengte in linker en rechter hand <u>MET ZOOMERS</u>)</p></li>\n</ul>\n<p><em><u>Piramide zwemmen</u></em></p>\n<ul>\n<li><p><strong>50m – 15s rust – 75m – 25m actieve rust – 100m – 30s rust – 100m – 25m actieve rust – 75m – 15s rust – 50m</strong></p></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<p><strong>100m</strong> MET startduik en tuimelkeerpunt aan 100%</p>\n<p><strong>100m</strong> uitzwemmen</p>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-13"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-2","z-crawl","Effectieve leerlijn borstcrawl - les 2",[F("Effectieve leerlijn borstcrawl - les 2","effectieve leerlijn borstcrawl - les 2.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_2.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 2:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Benen crawl met plankje – hoofd boven water (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n<li><p>Benen crawl met plankje – hoofd boven water – tussen kegels plankje vertikaal houden (meer weerstand) (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Snelle rotatie (vanuit de heupen)</u></p></li>\n</ol>\n<ul>\n<li><p>Op de zij zwemmen met benen – armen gestrekt langs het lichaam en handen op dijen – hoofd ontspannen en naar de bodem kijken (<strong>4x 1 lengte</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: traag uitvoeren, de oefening leren begrijpen en onder de knie krijgen.</p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/5AqtoYijGGQ\">voorbeeldvideo</a></p></li>\n</ul>\n<ul>\n<li><p>Idem vorige oefening, maar snel naar de andere zij draaien vanuit het bekken – hoofd blijft ontspannen en naar de bodem kijken (<strong>2x 2 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: leren snel roteren vanuit het bekken en dissociatie ontwikkelen tussen hoofd en romp.</p></li>\n</ul></li>\n<li><p>Idem oefening 2, maar om de 8 slagen van zijde wisselen (2 x 2 lengtes, met zoomers)</p>\n<ul>\n<li><p>Doel: de rotaties kunnen maken met een opgelegde timing.</p></li>\n</ul></li>\n<li><p>Idem oefening 3, maar 50cm onder het wateroppervlak (meer weerstand, bekken moet harder werken om te roteren) (<strong>2x 2 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: rotatie versnellen</p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/bMpadBl-vhs\">voorbeeldvideo</a></p></li>\n</ul>\n<ul>\n<li><p>Herhaling oefening 3, maar nog sneller proberen roteren (<strong>2x 2 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: De versnelde rotatie van de vorige oefening omzetten bij een normale ligging aan het wateroppervlak.</p></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p>Crawl met zo laag mogelijk # slagen (<strong>2x 1 lengte</strong>, <em><u>zonder</u> zoomers</em>, 2<sup>de</sup> lengte minder # slagen dan eerste lengte)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>cooling down</p></li>\n<li><p>hen laten experimenteren met de combinatie ademhaling en armbeweging</p></li>\n<li><p>gewenning aan het zwemmen zonder zoomers</p></li>\n</ul></li>\n</ul></li>\n<li><p>Crawl met zo weinig mogelijk ademhaling (<strong>2x 1 lengte</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>cooling down</p></li>\n<li><p>laten experimenteren met de combinatie beenbeweging en armbeweging, zonder op de ademhaling te hoeven letten</p></li>\n<li><p>gewenning aan het zwemmen zonder zoomers</p></li>\n</ul></li>\n</ul></li>\n</ul>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-2"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-3","z-crawl","Effectieve leerlijn borstcrawl - les 3",[F("Effectieve leerlijn borstcrawl - les 3","effectieve leerlijn borstcrawl - les 3.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_3.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 3:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Benen crawl met plankje – hoofd boven water (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n<li><p>Benen crawl met plankje – hoofd boven water – tussen kegels plankje vertikaal houden (meer weerstand) (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Snelle rotatie (vanuit de heupen)</u></p></li>\n</ol>\n<ul>\n<li><p>Op de zij zwemmen met benen – armen gestrekt langs het lichaam en handen op dijen – om de 8 slagen snel naar de andere zij draaien vanuit het bekken – hoofd blijft ontspannen en naar de bodem kijken (<strong>2x 2 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: snelle rotatie vanuit de heupen (herhaling vorige les)</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=5AqtoYijGGQ&amp;index=4&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Toevoegen ademhaling</u></p></li>\n</ol>\n<ul>\n<li><p>Per 2: de partner vasthouden op zijn zij in het ondiep – partner kijkt 6 tellen naar de bodem en blaast bellen/lucht uit om vervolgens zijn hoofd ontspannen te draaien en 2 tellen lucht te happen.</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>het hoofd ontspannen houden</p></li>\n<li><p>hoofd in het verlengde van de romp houden/niet voorwaarts opheffen (een rechte lijn bewaren)</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Op de zij zwemmen met benen – armen gestrekt langs het lichaam en handen op dijen – hoofd blijft ontspannen en naar de bodem kijken, tijdens beenslag 2t/m5 uitblazen; (belletjes blazen), tijdens beenslag 6 t/m 8 hoofd rotatie + ademhaling (<strong>2x 4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: toevoegen ademhaling</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/A6HD9Z0Y-oo\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n<li><p>Zelfde als vorige oefening, maar met één arm gestrekt naar voor. “superman” – hoofd ontspannen en ontspannen draaien. (<strong>2x 4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em>met zoomers</em>)<br />\n=&gt; afdaling een pull buoy in de voorste hand houden voor meer drijfvermogen</p>\n<ul>\n<li><p>Doel: voorbereiding armbeweging</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/6P9yldcAo_A\">voorbeeldvideo</a></p></li>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/68T-YYzB9Bw\">voorbeeldvideo afdaling</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p><strong>3x 2 lengtes</strong> crawl (armen + benen, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>slagen tellen</p></li>\n<li><p>op tijd zwemmen</p>\n<p># slagen + tijd laten noteren = even pauze</p></li>\n<li><p>tijd + slagen = SWOLF<br />\nSWOLF-score laten noteren</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>eigen evolutie beoordelen</p></li>\n<li><p>laten experimenteren met de combinatie beenbeweging en armbeweging</p></li>\n<li><p>gewenning aan het zwemmen zonder zoomers</p></li>\n</ul></li>\n</ul></li>\n</ol>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-3"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-4","z-crawl","Effectieve leerlijn borstcrawl - les 4",[F("Effectieve leerlijn borstcrawl - les 4","effectieve leerlijn borstcrawl - les 4.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_4.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 4:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Benen crawl met plankje – hoofd boven water (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n<li><p>Benen crawl met plankje – hoofd boven water – tussen kegels plankje vertikaal houden (meer weerstand) (<strong>4 lengtes</strong>, <em>met zoomers</em>)</p></li>\n<li><p>SWOLF (<strong>2lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Ademhaling</u></p></li>\n</ol>\n<ul>\n<li><p>Op de zij zwemmen met benen – armen gestrekt langs het lichaam en handen op dijen – hoofd blijft ontspannen en naar de bodem kijken, tijdens beenslag 2t/m5 uitblazen; (belletjes blazen), tijdens beenslag 6 t/m 8 hoofd rotatie (<strong>4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, met zoomers)</p>\n<ul>\n<li><p>Doel: inoefenen ademhaling (herhaling vorige les)</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/A6HD9Z0Y-oo\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n<li><p>Zelfde als vorige oefening, maar met één arm gestrekt naar voor. “superman” – hoofd ontspannen en ontspannen draaien. (<strong>4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: voorbereiding armbeweging (herhaling vorige les)</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://youtu.be/6P9yldcAo_A\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Toevoeging armbeweging</u></p></li>\n</ol>\n<ul>\n<li><p>Rol + armbeweging (<strong>2x 4 lengtes</strong>, <em>met zoomers</em>) – 8 beenslagen op 1zij, 1arm opwaarts en 1 hand afwaarts – na 8 beenslagen roteren langs lengte-as en 2 armen, als 2 wieken van een molen, wisselen – geen ademhaling</p>\n<ul>\n<li><p>Doel: toevoeging armbeweging</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n<li><p>Zelfde als vorige oefening, maar nu met ademhaling. (<strong>2x 4 lengtes</strong>, <em>met zoomers</em>)<br />\n=&gt; afdaling: een pull buoy of plankje vastnemen</p>\n<ul>\n<li><p>Nadeel: afslag zwemmen</p></li>\n<li><p>Voordeel: meer steun, zodat je beter aan het wateroppervlak ligt</p></li>\n</ul>\n<ul>\n<li><p>Doel: bewuste ademhaling op het juiste moment toevoegen</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p><u>Startduik</u></p>\n<ul>\n<li><p>Zwembrilletje zéér strak aanspannen</p></li>\n<li><p>Stap 1:</p>\n<ul>\n<li><p>vanuit zit op de kant (voeten in het gootje)</p></li>\n<li><p>vingertoppen het water laten raken</p></li>\n<li><p>hoofd klemmen tussen armen (cfr. pijlfase)</p></li>\n<li><p>armen strekken en handen op elkaar (cfr. pijlfase)</p></li>\n<li><p>zitvlak opheffen, voorwaarts reiken en licht afstoten met de voeten</p></li>\n</ul></li>\n<li><p>Stap 2:</p>\n<ul>\n<li><p>Idem stap 1 maar vanuit hurkzit</p></li>\n</ul></li>\n<li><p>Stap 3:</p>\n<ul>\n<li><p>Idem stap 1 maar vanuit stand</p></li>\n</ul></li>\n</ul></li>\n</ul>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-4"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-5","z-crawl","Effectieve leerlijn borstcrawl - les 5",[F("Effectieve leerlijn borstcrawl - les 5","effectieve leerlijn borstcrawl - les 5.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_5.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 5:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Benen crawl met plankje op buik, ademhaling d.m.v. rotatie (<strong>3x 2 lengtes</strong>, 15” rust, <em><u>zonder</u> zoomers</em>)</p></li>\n<li><p>SWOLF (<strong>2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Inoefenen armbeweging</u></p></li>\n</ol>\n<ul>\n<li><p>Rol + armbeweging (<strong>2x 4 lengtes</strong>, <em>met zoomers</em>) – 8 beenslagen op 1zij, 1arm opwaarts en 1 hand afwaarts – na 8 beenslagen roteren langs lengte-as en 2 armen, als 2 wieken van een molen, wisselen – met ademhaling</p>\n<ul>\n<li><p>Doel: bewuste ademhaling op het juiste moment toevoegen (herhaling)</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n<li><p>Eindvorm met armbeweging + ademhaling (<strong>2x 4 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel: vloeiend maken van de borstcrawl</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=m9iPtFtsHlo\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n<li><p>Crawl zonder zoomers – blokjes van 50m, 30” rust. – focus op ligging en ademhaling.</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>gewenning aan het zwemmen zonder zoomers (<strong>5x 2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n<li><p>vloeiend maken van de borstcrawl</p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p>25m met startduik, via de kant terug (<strong>4x 1 lengte</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>inoefenen startduik (vlak induiken)</p></li>\n<li><p>gewenning aan het zwemmen zonder zoomers</p></li>\n</ul></li>\n</ul></li>\n</ul>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-5"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-6","z-crawl","Effectieve leerlijn borstcrawl - les 6",[F("Effectieve leerlijn borstcrawl - les 6","effectieve leerlijn borstcrawl - les 6.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_6.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 6:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Rol + armbeweging (<strong>2x 4 lengtes</strong>, <em>met zoomers</em>) – 8 beenslagen op 1zij, 1arm opwaarts en 1 hand afwaarts – na 8 beenslagen roteren langs lengte-as en 2 armen, als 2 wieken van een molen, wisselen</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>Inoefenen armbeweging</p></li>\n<li><p>Inoefenen zijwaarts ademhalen met ontspannen hoofd</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Op de zij zwemmen met benen – met één arm gestrekt naar voor. “superman” met pull buoy – hoofd blijft ontspannen en naar de bodem kijken, tijdens beenslag 2t/m5 uitblazen; (belletjes blazen), tijdens beenslag 6 t/m 8 hoofd rotatie (<strong>4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em><u>zonder</u> zoomers</em>, <em>met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>inoefenen uitblazen in het water</p></li>\n<li><p>verbetering beenslag (niet vanuit de knieën! – grote amplitude)</p>\n<ul>\n<li></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=68T-YYzB9Bw&amp;index=8&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Inoefenen zwemmen zonder zoomers</u></p></li>\n</ol>\n<ul>\n<li><p>Crawl (<strong>4x 2 lengtes, 30” rust</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel: inoefenen van het zwemmen zonder zoomers</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Foutendetectie en correctie (rustig zwemmen aan 70% van je maximum)</u></p></li>\n</ol>\n<ul>\n<li><p>Keerpunt “pijlfase”<br />\nKant aantikken – zakken tot volledig onder water – afstoten – pijlfase (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel: na keerpunt meteen gestroomlijnde positie aannemen (weerstand verminderen)</p></li>\n</ul></li>\n<li><p>‘Armen’: overlopen 5 fasen van de armbeweging:</p>\n<ul>\n<li><p>Doel: beter inzicht in de armbeweging krijgen</p>\n<ul>\n<li><p><u>zie bijlage</u></p></li>\n</ul></li>\n</ul></li>\n<li><p>‘Armen’: fase1: de reach<br />\nafslag met pull buoy (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers, met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>ver insteken</p></li>\n<li><p>hand niet diep onder het wateroppervlak insteken</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<p>slaap tikken en ver insteken (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>zo ver mogelijk reiken met de armen</p></li>\n<li><p>vingertoppen gaan eerst in het water</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=nHWRx5taynQ&amp;index=20&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p>“Startduik”: Induiken – lengte uitzwemmen – zijkant terug (<strong>2x 1 lengte</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<p><strong><u>Crawl: 5 fases van de armbeweging</u></strong></p>\n<ol type=\"1\">\n<li><p>ver insteken, vingers eerst, arm mag hier niet lager zakken dan 10cm onder het water (<strong>Reach</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_6_media/media/image1.png\" /></p>\n<ol start=\"2\" type=\"1\">\n<li><p>voorarm gaat neerwaarts terwijl elleboog hoog blijft (<strong>Catch</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_6_media/media/image2.png\" /></p>\n<ol start=\"3\" type=\"1\">\n<li><p>arm achterwaarts trekken (S-vorm) (<strong>Pull</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_6_media/media/image3.png\" /></p>\n<ol start=\"4\" type=\"1\">\n<li><p>krachtig uitduwen thv. de heup (<strong>Push</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_6_media/media/image4.png\" /></p>\n<ol start=\"5\" type=\"1\">\n<li><p>terugbrengen van de arm (<strong>Recovery</strong>)</p></li>\n</ol>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-6"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-7","z-crawl","Effectieve leerlijn borstcrawl - les 7",[F("Effectieve leerlijn borstcrawl - les 7","effectieve leerlijn borstcrawl - les 7.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_7.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 7:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Rol + armbeweging (<strong>2x 4 lengtes</strong>, <em><u>zonder</u> zoomers</em>) – 8 beenslagen op 1zij, 1arm opwaarts en 1 hand afwaarts – na 8 beenslagen roteren langs lengte-as en 2 armen, als 2 wieken van een molen, wisselen</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>Inoefenen armbeweging</p></li>\n<li><p>Inoefenen zijwaarts ademhalen met ontspannen hoofd</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Op de zij zwemmen met benen – met één arm gestrekt naar voor. “superman” met pull buoy – hoofd blijft ontspannen en naar de bodem kijken, tijdens beenslag 2t/m5 uitblazen; (belletjes blazen), tijdens beenslag 6 t/m 8 hoofd rotatie (<strong>4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em><u>zonder</u> zoomers</em>, <em>met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>inoefenen uitblazen in het water</p></li>\n<li><p>verbetering beenslag (niet vanuit de knieën! – grote amplitude)</p>\n<ul>\n<li></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=68T-YYzB9Bw&amp;index=8&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a>Op de rug zwemmen – pull buoy op je buik, kijken naar plafond – grote /bijna gestrekte beenbeweging (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers, met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>Verbetering beenslag (niet vanuit de knieën! – grote amplitude)</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Foutendetectie en correctie (rustig zwemmen aan 70% van je maximum)</u></p></li>\n</ol>\n<ul>\n<li><p>Overlopen 5 fasen van de armslag</p>\n<ul>\n<li><p>Doel: beter inzicht in de zwembeweging krijgen</p>\n<ul>\n<li><p><u>zie bijlage</u></p></li>\n</ul></li>\n</ul></li>\n<li><p>‘Armen’: fase 2: de catch-fase<br />\nvanuit schouderbrede pijlfase de voorarmen telkens laten trekken tot de arm/hand recht naar de bodem wijst (ellenboog blijft hoog!!!) thv de schouders ‘botst’ je voorarm tegen een muur en je brengt de arm terug (<strong>2x 2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>verbetering stuwing armen</p></li>\n<li><p>hoge ellenboog tijdens de catch</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=R2OqgTJCBhg&amp;index=17&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p>zwemmen als Jerommeke (superbreed), hierdoor maak je een hoek in je ellenboog en wijzen je onderarmen naar beneden (<strong>2x 2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>verbetering stuwing armen</p></li>\n<li><p>hoge ellenboog tijdens de catch</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p>zwemmen met vuisten (<strong>2x 2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>verbetering stuwing armen</p></li>\n<li><p>hoge ellenboog tijdens de catch</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=4wyFUQFvnkc&amp;index=21&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">Voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>‘Armen’: fase 3: de push-fase<br />\nmet de duim het dijbeen tikken + actieve polsslag geven (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>afwerken armbeweging</p></li>\n<li><p>extra stuwing genereren</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=RfrWWdw0igc&amp;index=18&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p>SWOLF-score zwemmen (<strong>2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<p><strong><u>Crawl: 5 fases van de armbeweging</u></strong></p>\n<ol type=\"1\">\n<li><p>ver insteken, vingers eerst, arm mag hier niet lager zakken dan 10cm onder het water (<strong>Reach</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_7_media/media/image1.png\" /></p>\n<ol start=\"2\" type=\"1\">\n<li><p>voorarm gaat neerwaarts terwijl elleboog hoog blijft (<strong>Catch</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_7_media/media/image2.png\" /></p>\n<ol start=\"3\" type=\"1\">\n<li><p>arm achterwaarts trekken (S-vorm) (<strong>Pull</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_7_media/media/image3.png\" /></p>\n<ol start=\"4\" type=\"1\">\n<li><p>krachtig uitduwen thv. de heup (<strong>Push</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_7_media/media/image4.png\" /></p>\n<ol start=\"5\" type=\"1\">\n<li><p>terugbrengen van de arm (<strong>Recovery</strong>)</p></li>\n</ol>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-7"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-8","z-crawl","Effectieve leerlijn borstcrawl - les 8",[F("Effectieve leerlijn borstcrawl - les 8","effectieve leerlijn borstcrawl - les 8.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_8.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 8:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Rol + armbeweging (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>) – 8 beenslagen op 1zij, 1arm opwaarts en 1 hand afwaarts – na 8 beenslagen roteren langs lengte-as en 2 armen, als 2 wieken van een molen, wisselen</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>Inoefenen armbeweging</p></li>\n<li><p>Inoefenen zijwaarts ademhalen met ontspannen hoofd</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Op de zij zwemmen met benen – met één arm gestrekt naar voor. “superman” met pull buoy – hoofd blijft ontspannen en naar de bodem kijken, tijdens beenslag 2t/m5 uitblazen; (belletjes blazen), tijdens beenslag 6 t/m 8 hoofd rotatie (<strong>4 lengtes</strong>, heen op linker zijde, terug op rechter zijde, <em><u>zonder</u> zoomers</em>, <em>met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>inoefenen uitblazen in het water</p></li>\n<li><p>verbetering beenslag (niet vanuit de knieën! – grote amplitude)</p>\n<ul>\n<li></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=68T-YYzB9Bw&amp;index=8&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a>Op de rug zwemmen – pull buoy op je buik, kijken naar plafond – grote /bijna gestrekte beenbeweging (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers, met pull buoy</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>Verbetering beenslag (niet vanuit de knieën! – grote amplitude)</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Foutendetectie en correctie: herhaling (rustig zwemmen aan 70% van je maximum)</u></p></li>\n</ol>\n<ul>\n<li><p>‘Armen’: fase 1: de reach-fase<br />\nslaap tikken en vervolgens ver insteken (vingertoppen eerst, hand zeer lichtjes naar beneden (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>verbetering stuwing armen</p></li>\n<li><p>ver en juist insteken</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>‘Armen’: fase 2: de catch-fase<br />\nzwemmen als Jerommeke (superbreed), hierdoor maak je een hoek in je ellenboog en wijzen je onderarmen naar beneden (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>verbetering stuwing armen</p></li>\n<li><p>hoge ellenboog tijdens de catch</p>\n<ul>\n<li><p><u>voorbeeldvideo</u></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>‘Armen’: fase 4: de push-fase<br />\nmet de duim het dijbeen tikken + actieve polsslag geven (<strong>4 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>afwerken armbeweging</p></li>\n<li><p>extra stuwing genereren</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=RfrWWdw0igc&amp;index=18&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Economisch zwemmen</u></p></li>\n</ol>\n<ul>\n<li><p>Het aantal slagen systematisch proberen verminderen. Snelheid is van geen belang, maar er moet wel doorgezwommen worden (± 70% max.) (<strong>3x</strong> <strong>2 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p></li>\n</ul>\n<p><strong><br />\n</strong></p>\n<p><strong>Slot:</strong></p>\n<ul>\n<li><p>Tuimelkeerpunt fase 1:<br />\nRecht tuimelen met noodle voor je (armen niet gebruiken!) en terug landen op je voeten – wanneer dit goed lukt, het tempo opdrijven en sneller draaien – een reeksje maken van verschillende koprollen</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>klein bolletje maken</p></li>\n<li><p>snel roteren</p></li>\n<li><p>handen aan het wateroppervlak houden en NIET gebruiken om te roteren!</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=tQLPC0Z79lA&amp;index=13&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>wanneer je met je benen in de noodle blijft haken, moet je een kleiner bolletje maken</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=mvRnRI6lwYM&amp;index=14&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo fout geen klein bolletje</a></p></li>\n</ul></li>\n<li><p>wanneer je een hand gelost hebt op het einde, roteer je schuin</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=zEK6o7XamHs&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc&amp;index=14\">voorbeeldvideo schuin roteren</a></p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>Tuimelkeerpunt fase 2:</p>\n<p>tuimelen aan kant met noodle achter je (gestrekte armen) =&gt; noodle vervangen door pullbuoys (pull buoys doorgeven)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>armen achter je aan de oppervlakte houden</p></li>\n<li><p>inschatten afstand tot de muur (ongeveer halve meter)</p></li>\n<li><p>door de neus lucht uitblazen</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=CwMiUaSzLcM&amp;index=24&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p>stap 2 maar nu zonder hulpmiddelen</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=aYvURon7P_E&amp;list=PL7NP0W42kyQg3e5gjGI_tN78a7Gox2dLc&amp;index=25\">Voorbeeldvideo</a></p></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>te diep in het water na keerpunt = armen gebruikt</p></li>\n</ul>\n<p><strong><u>Crawl: 5 fases van de armbeweging</u></strong></p>\n<ol type=\"1\">\n<li><p>ver insteken, vingers eerst, arm mag hier niet lager zakken dan 10cm onder het water (<strong>Reach</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_8_media/media/image1.png\" /></p>\n<ol start=\"2\" type=\"1\">\n<li><p>voorarm gaat neerwaarts terwijl elleboog hoog blijft (<strong>Catch</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_8_media/media/image2.png\" /></p>\n<ol start=\"3\" type=\"1\">\n<li><p>arm achterwaarts trekken (S-vorm) (<strong>Pull</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_8_media/media/image3.png\" /></p>\n<ol start=\"4\" type=\"1\">\n<li><p>krachtig uitduwen thv. de heup (<strong>Push</strong>)</p></li>\n</ol>\n<p><img loading=\"lazy\" src=\"docs/z-crawl/effectieve_leerlijn_borstcrawl_les_8_media/media/image4.png\" /></p>\n<ol start=\"5\" type=\"1\">\n<li><p>terugbrengen van de arm (<strong>Recovery</strong>)</p></li>\n</ol>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-8"].doc=true;
pg("doc-z-crawl-effectieve-leerlijn-borstcrawl-les-9","z-crawl","Effectieve leerlijn borstcrawl - les 9",[F("Effectieve leerlijn borstcrawl - les 9","effectieve leerlijn borstcrawl - les 9.docx","docs/z-crawl/effectieve_leerlijn_borstcrawl_les_9.docx"),["html","<p><strong><u>Effectieve leerlijn borstcrawl: les 9:</u></strong></p>\n<p><strong>Opwarming:</strong></p>\n<ul>\n<li><p>Borstcrawl met zoomers: focus op ademhaling en ontspannen van het hoofd (<strong>8 lengtes</strong>, <em>met zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>ontspannen van hoofd tijdens ademhaling</p></li>\n<li><p>roteren (zonder opheffen hoofd)</p></li>\n</ul></li>\n</ul></li>\n</ul>\n<p><strong>Kern:</strong></p>\n<ol type=\"1\">\n<li><p><u>Training armen</u></p></li>\n</ol>\n<ul>\n<li><p>Borstcrawl met paddles, zonder benen (<strong>8 lengtes</strong>, <u>zonder</u> <em>zoomers, met vlotter + elastiek</em>)</p>\n<ul>\n<li><p>Doel: verbeteren armbeweging</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=LFntXxDil-U\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><u>Tuimelkeerpunt</u></p></li>\n</ol>\n<ul>\n<li><p>Herhaling fase 2:<br />\naanzwemmen met armen achterwaarts zonder hulpmiddelen + afstoot en rugwaarts in pijlfase drijven</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>armen achter je aan de oppervlakte houden</p></li>\n<li><p>inschatten afstand tot de muur (ongeveer halve meter)</p></li>\n<li><p>door de neus lucht uitblazen</p>\n<ul>\n<li><p><a target=\"_blank\" rel=\"noopener\" href=\"https://www.youtube.com/watch?v=m9iPtFtsHlo\">voorbeeldvideo</a></p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Fase 3:<br />\naanzwemmen naar de muur met armen + afstoot en rugwaarts in pijlfase drijven</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>lucht uitblazen door de neus</p></li>\n<li><p>inoefen laatste twee slagen tijdens het aanzwemmen</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<ul>\n<li><p>Kijk naar de knieën voor een goed gestroomlijnde positie!</p></li>\n</ul>\n<ul>\n<li><p>Fase 4:</p>\n<p>idem fase 3 maar voeten op 2u of 10u tegen de muur zetten + doordraaien naar de buik en in pijlfase verder drijven</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>uitvinden of je de voeten op 2u of 10u moet zetten</p></li>\n<li><p>correcte pijlfase aannemen na de afstoot</p></li>\n<li><p>terug aan de oppervlakte komen voor de eerste armbeweging wordt gemaakt</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n<ol start=\"3\" type=\"1\">\n<li><p><u>Toepassen tuimelkeerpunt tijdens zwemmen</u></p></li>\n</ol>\n<ul>\n<li><p>Aflossing met rustmoment</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>versoepelen tuimelkeerpunt</p></li>\n<li><p>timing tuimelkeerpunt</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n<li><p>Borstcrawl met tuimelkeerpunt (<strong>6 lengtes</strong>, <em><u>zonder</u> zoomers</em>)</p>\n<ul>\n<li><p>Doel:</p>\n<ul>\n<li><p>toepassen tuimelkeerpunt in testsituatie met vermoeidheid en ademnood</p>\n<ul>\n<li><p>voorbeeldvideo</p></li>\n</ul></li>\n</ul></li>\n</ul></li>\n</ul>\n"]]);PAGES["doc-z-crawl-effectieve-leerlijn-borstcrawl-les-9"].doc=true;
pg("doc-z-crawl-fouten-en-remedieringen-borstcrawl-bijlage-les-13","z-crawl","Fouten en remediëringen borstcrawl - bijlage les 13",[F("Fouten en remediëringen borstcrawl - bijlage les 13","fouten en remediëringen borstcrawl - bijlage les 13.docx","docs/z-crawl/fouten_en_remedieringen_borstcrawl_bijlage_les_13.docx"),["html","<p><strong><u>Fouten en remediëringen borstcrawl:</u></strong></p>\n<ol type=\"1\">\n<li><p><strong>Reach:</strong></p>\n<ol type=\"a\">\n<li><p>Bij het insteken blijft de hand niet op 5cm onder het wateroppervlak, maar zinkt deze meteen 30cm of meer onder het wateroppervlak. (Kan links, rechts of links én rechts zijn)</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>extra uitstrekken van de arm die insteekt en even een rustmoment inbouwen.</p>\n<ol type=\"a\">\n<li><p>Overkruisen: Er wordt ingestoken voorbij de middenlijn.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n<li><p>Naar buiten insteken.</p></li>\n</ul>\n<ol start=\"2\" type=\"1\">\n<li><p><strong>Catch:</strong></p>\n<ol type=\"a\">\n<li><p>De vingers wijzen niet naar de bodem/ellenboog, onderarm en hand bevinden zich op bijna gelijke hoogte.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>De schouder hoog houden tijdens de catch.</p></li>\n<li><p>Zwemmen met vuisten.</p></li>\n<li><p>Een arm gestrekt op een vlotter/plankje en met de andere arm enkel de catch uitvoeren</p></li>\n</ul>\n<ol start=\"3\" type=\"1\">\n<li><p><strong>Pull:</strong></p>\n<ol type=\"a\">\n<li><p>Er wordt onder het lichaam door getrokken (vaak wanneer er ingeademd wordt). De onderarm is op dat moment horizontaal in plaats van verticaal naar de bodem gericht.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>Om de 3 slagen ademhalen.</p></li>\n<li><p>Met een frontale snorkel zwemmen (rotatie uitschakelen) =&gt; minder fel roteren (onderste glas van de duikbril in het water houden tijdens de ademhaling).</p></li>\n</ul>\n<ol start=\"4\" type=\"1\">\n<li><p><strong>Push:</strong></p>\n<ol type=\"a\">\n<li><p>De arm is niet gestrekt (of bijna gestrekt) bij het verlaten van het water, er is geen versnelling en geen ‘polsslag’. Hierdoor verlies je enorm veel stuwing en snelheid.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>Bewust actief versnellen in de pushfase.</p></li>\n<li><p>Met de duim het bovenbeen tikken bij het uithalen.</p></li>\n</ul>\n<ol start=\"5\" type=\"1\">\n<li><p><strong>Recovery:</strong></p>\n<ol type=\"a\">\n<li><p>Lage ellenboog, armen slepen zijwaarts door het water.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>Met de ellenboog het wateroppervlak breken na de push.</p></li>\n<li><p>De vingers door het water laten slepen tijdens de recovery.</p></li>\n</ul>\n<ol start=\"6\" type=\"1\">\n<li><p><strong>Ademhaling:</strong></p>\n<ol type=\"a\">\n<li><p>Het hoofd draait te ver (dus ook het lichaam), de blik is naar het plafond.</p>\n<p><u>REMEDIËRING:</u></p></li>\n</ol></li>\n</ol>\n<ul>\n<li><p>Tijdens het zwemmen 50% van de lucht uitgeblazen hebben door de neus, zodat je enkel nog hoeft in te ademen tijdens de ademhaling.</p></li>\n<li><p>Het onderste glas van de duikbril in het water houden tijdens de ademhaling.</p></li>\n</ul>\n"]]);PAGES["doc-z-crawl-fouten-en-remedieringen-borstcrawl-bijlage-les-13"].doc=true;
