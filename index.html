<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Sportwetenschappen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: witte schoolstijl (Agnetencollege), logo links in een witte kop, menuboom links, inhoud rechts */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#2a2d30; --muted:#6b6a6e; --line:#e1e6e5;
  --brand:#65a8a1; --red:#c95f55;
  --accent:#2e7a72; --accent-ink:#ffffff; --court:#2e7a72; --court-soft:#ecf5f4; --chip-off:#f2f4f4;
  --display:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--court)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);color:var(--ink);border-bottom:4px solid var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.04)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font:500 1.15rem/1.15 var(--display);color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:14px}
.brand img{height:46px;width:auto;display:block}
.brand span{border-left:1px solid var(--line);padding-left:14px}
@media (max-width:520px){.brand span{display:none}}
.topnav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.topnav a{color:var(--muted);text-decoration:none;font:600 1rem/1 var(--display);padding:10px 12px;border-bottom:3px solid transparent}
.topnav a:hover{color:var(--court)}
.topnav a.on{color:var(--court);border-bottom-color:var(--brand)}
.search{position:relative}
.search input{font:inherit;font-size:.95rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);width:210px;max-width:100%;background:var(--chip-off);color:var(--ink)}
.results{position:absolute;right:0;top:110%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;width:300px;max-width:85vw;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.results a{display:block;padding:8px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.results a small{display:block;color:var(--muted)}
.results a:hover{background:var(--court-soft)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:32px;padding-block:28px 64px}
@media (max-width:600px){header.top{position:static}}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}
aside.tree{font-size:.95rem;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:860px){aside.tree{position:static;max-height:none}}
.tree-toggle{display:none;font:600 1rem var(--display);background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:6px;width:100%;text-align:left;cursor:pointer}
@media (max-width:860px){.tree-toggle{display:block}aside.tree:not(.open) .tree-body{display:none}}
.tree ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:14px;border-left:1px solid var(--line);margin-left:6px}
.tree li{margin:1px 0}
.tree a{display:block;padding:4px 8px;border-radius:4px;color:var(--ink);text-decoration:none}
.tree a:hover{background:var(--court-soft)}
.tree a.on{background:var(--court);color:#fff}
.tree .lvl0>li>a{font:700 1.05rem var(--display);color:var(--court)}
.tree .lvl0>li>a.on{color:#fff}
main{min-width:0}
.crumbs{font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.crumbs a{color:var(--muted)}
h1{font:700 clamp(1.9rem,4.5vw,2.7rem)/1.1 var(--display);margin:0 0 22px;text-wrap:balance;padding-bottom:12px;border-bottom:3px solid var(--brand);display:inline-block}
h2{font:700 1.45rem/1.2 var(--display);color:var(--court);margin:28px 0 10px;text-wrap:balance}
h3{font:600 1.15rem/1.25 var(--display);margin:22px 0 8px;color:var(--ink)}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin:3px 0}
.attn{font:700 .85rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:6px 0 18px}
.media{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.media .frame{aspect-ratio:16/9;max-width:100%;background:var(--court-soft);display:grid;place-items:center;position:relative}
.media .frame video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.media .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media .frame svg{width:44px;height:44px;color:var(--court)}
.media .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.media .meta b{font-weight:600;line-height:1.3}
.media .meta span{font-size:.82rem;color:var(--muted);word-break:break-word}
.media .meta a{font-size:.88rem;font-weight:600}
.media.doc{flex-direction:row;align-items:center}
.media.doc .ico{flex:none;width:52px;align-self:stretch;display:grid;place-items:center;background:var(--court-soft);color:var(--court);font:700 .8rem var(--display);letter-spacing:.06em;text-transform:uppercase}
.media.doc .meta{min-width:0}
.linklist{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.pill:hover{border-color:var(--court);background:var(--court-soft)}
.linklist:has(.dl) .pill{min-width:15rem;justify-content:center}
.pill.dl{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.dl:hover{background:var(--accent);filter:brightness(1.08)}
.pill.off{color:var(--muted);background:var(--chip-off);border-style:dashed;cursor:default}
.figure{margin:8px 0 18px;max-width:900px}
.figure img{display:block;width:100%;border-radius:8px;border:1px solid var(--line);background:var(--court-soft)}
.imgph{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);font-size:.9rem;background:var(--surface)}
.empty{color:var(--muted);font-style:italic}
/* home */
.hero{border-radius:12px;overflow:hidden;position:relative;background:var(--court);color:#fff;margin-bottom:26px;min-height:200px;display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.hero .txt{position:relative;padding:28px;max-width:640px}
.hero h1{color:#fff;margin:0 0 6px;font-size:clamp(1.8rem,6vw,2.8rem);overflow-wrap:anywhere;border:0;padding:0}
.hero p{margin:0;font-size:1.05rem}
.years{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:34px}
@media (max-width:560px){.years{grid-template-columns:repeat(2,minmax(0,1fr))}}
.year{display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:16px;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:110px}
.year b{font:700 2.6rem/1 var(--display);color:var(--court)}
.year span{font:600 .85rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a.year:hover{border-color:var(--brand);box-shadow:inset 0 -4px 0 var(--brand)}
.year.off{background:var(--chip-off);border-style:dashed;color:var(--muted)}
.year.off b{color:var(--muted)}
.sports{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.sport{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.sport .pic{aspect-ratio:16/10;max-width:100%;background:linear-gradient(135deg,var(--brand),var(--court-soft));position:relative}
.sport .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sport .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.sport h2{margin:0;font-size:1.35rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .9rem var(--display);padding:5px 10px;border-radius:4px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.chip.off{background:var(--chip-off);color:var(--muted)}
.docbody{max-width:900px}
.docbody p,.docbody li{max-width:68ch}
.docbody h2{margin-top:36px}
.docbody .tablewrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.docbody table{border-collapse:collapse;width:100%;min-width:520px;font-size:.95rem}
.docbody th{text-align:left;background:var(--court-soft);color:var(--ink);font-weight:600}
.docbody th,.docbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.docbody tr:last-child td{border-bottom:0}
.docbody figure{margin:12px 0 18px}
.docbody figure img{display:block;width:100%;max-width:900px;border-radius:8px;border:1px solid var(--line);background:#fff}
.docbody figcaption{font-size:.85rem;color:var(--muted);margin-top:6px}
footer{border-top:4px solid var(--brand);background:var(--chip-off);color:var(--muted);font-size:.9rem}
footer .wrap{padding-block:18px}
@media (prefers-reduced-motion:no-preference){.pill,.year,.chip{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>

  ["html","<h2>Zo gebruik je deze bundel</h2> <p>Je kiest zelf de oefeningen die voor jou niveau van toepassing zijn. Je start best met een te makkelijke oefening dan met een te moeilijke. De oefeningen staan steeds van makkelijk naar moeilijk.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>#</th> <th>Opdracht</th> <th>Norm 3SPW</th> </tr> </thead> <tbody> <tr> <td>1</td> <td>Pompen</td> <td>25 x</td> </tr> <tr> <td>2</td> <td>Optrekken (bovenhandse greep)</td> <td>2 x</td> </tr> <tr> <td>3</td> <td>Beenstretch tegen de muur</td> <td>been horizontaal (90°), raakt de muur niet, 5 tellen</td> </tr> <tr> <td>4</td> <td>Spreidzit</td> <td>120°</td> </tr> <tr> <td>5</td> <td>Plankhouding</td> <td>2 minuten</td> </tr> <tr> <td>6</td> <td>Hazensprong</td> <td>reeks over de lengte van een mat</td> </tr> <tr> <td>7</td> <td>Lenigheid schoudergordel (bezemsteel)</td> <td>35°</td> </tr> </tbody> </table></div> <p><strong>Stappenplan</strong></p> <ol type=\"1\"> <li><p><strong>Test jezelf.</strong> Probeer de eindvorm. Lukt het al? Hou het dan bij met de laatste oefeningen uit de lijst.</p></li> <li><p><strong>Kies 2 à 3 oefeningen per opdracht</strong> die je nog niet makkelijk vindt. Goed gekozen = de laatste herhalingen zijn zwaar, maar je techniek blijft netjes.</p></li> <li><p><strong>Schuif op.</strong> Haal je de aangegeven hoeveelheid twee trainingen na elkaar met goede techniek? Kies de volgende, moeilijkere oefening.</p></li> </ol> <p><strong>Hoe vaak?</strong></p> <ul> <li><p>Kracht (pompen, optrekken, plank, hazensprong): 2 à 3 keer per week, met een rustdag tussen.</p></li> <li><p>Lenigheid (beenstretch, spreidzit, schouders): liefst 4 à 5 keer per week, 10 minuten is genoeg. Altijd met warme spieren.</p></li> </ul> <p><strong>Waar?</strong> In de kolom <em>Waar &amp; materiaal</em> zie je of een oefening thuis, in de sporthal of op beide plaatsen kan.</p> <p><strong>Veilig oefenen</strong></p> <ul> <li><p>Warm altijd 5 minuten op: ter plaatse joggen, armcirkels, beenzwaaien, polsen draaien.</p></li> <li><p>Rekken voelt trekkend, nooit pijnlijk. Hou de rek stil vast, niet verend, en adem rustig door.</p></li> <li><p>Thuis gebruik je alleen stevig materiaal: geen wankele stoelen, geen constructies in een deuropening.</p></li> <li><p>Scherpe pijn of pijn in een gewricht (pols, schouder, knie, onderrug)? Stop en meld het aan je leerkracht.</p></li> </ul> <h2>1. Pompen – norm: 25 x</h2> <p><strong>Eindvorm:</strong> 25 pompen na elkaar. Je lichaam vormt een rechte lijn van hoofd tot hielen, je borst zakt tot een vuist boven de grond en bovenaan zijn je armen gestrekt.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Muurpompen</td> <td>Handen schouderbreed tegen de muur, stap achteruit tot je schuin staat. Borst naar de muur, terugduwen.</td> <td>3 x 15</td> <td>Thuis &amp; sporthal – muur</td> </tr> <tr> <td>Pompen op verhoging</td> <td>Handen op een stevige verhoging. Hoe lager de verhoging, hoe zwaarder.</td> <td>3 x 10–12</td> <td>Thuis: tafel, trap – Sporthal: bank, kast</td> </tr> <tr> <td>Kniepompen</td> <td>Op je knieën, rechte lijn van knie tot hoofd. Borst naar de grond, terugduwen.</td> <td>3 x 10–15</td> <td>Thuis &amp; sporthal – mat of tapijt</td> </tr> <tr> <td>Negatieve pompen</td> <td>Start in hoge plank. Zak in 3–4 tellen tot op de grond, kom via je knieën terug omhoog.</td> <td>3 x 5–8</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Plank met schoudertikken</td> <td>Hoge plank (armen gestrekt). Tik om beurt met je hand op de andere schouder, heupen draaien niet.</td> <td>3 x 20 tikken</td> <td>Thuis &amp; sporthal – geen</td> </tr> <tr> <td>Pompen in blokjes</td> <td>Doe 25 echte pompen in zo weinig mogelijk blokjes, 1 minuut rust ertussen. Bijvoorbeeld 5 x 5 → 3 x 8 → 2 x 12 → 1 x 25.</td> <td>1 reeks van 25</td> <td>Thuis &amp; sporthal – geen</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image1.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image1.png\" alt=\"Pompen · 6 oefeningen, van makkelijk naar moeilijk\" loading=\"lazy\"></a><figcaption>Pompen · 6 oefeningen, van makkelijk naar moeilijk</figcaption></figure> <p><strong>Tip:</strong> hou je ellebogen schuin naast je lichaam (± 45°), niet wijd open. Zakken je heupen door? Dan is de oefening nog te zwaar: kies een makkelijkere.</p> <h2>2. Optrekken – norm: 2 x</h2> <p><strong>Eindvorm:</strong> 2 keer optrekken met bovenhandse greep (handpalmen van je weg). Je start in gestrekte hang, trekt je op tot je kin boven de stang is en zakt terug tot je armen gestrekt zijn.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Rugspieren op de buik (Y-T-W)</td> <td>Lig op je buik. Hef je armen gestrekt in een Y, dan een T, dan een W (ellebogen naar je zij). 2 tellen houden.</td> <td>3 x 8 per vorm</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Schuin roeien</td> <td>Lig onder een stevige tafel of lage stang, handen vast, lichaam recht. Trek je borst naar de rand of stang. Hoe platter je lichaam, hoe zwaarder.</td> <td>3 x 8–12</td> <td>Thuis: zware, stevige tafel – Sporthal: lage rekstok, ringen</td> </tr> <tr> <td>Gestrekte hang</td> <td>Hang aan de stang met bovenhandse greep. Hou je schouders laag, weg van je oren.</td> <td>3 x 20–30 sec</td> <td>Sporthal: rekstok, bovenste sport wandrek – Thuis: alleen met een goed vastgezette optrekstang</td> </tr> <tr> <td>Schouderbladen optrekken</td> <td>In gestrekte hang. Trek alleen je schouderbladen naar beneden en achter, je armen blijven gestrekt.</td> <td>3 x 6–8</td> <td>Sporthal: rekstok</td> </tr> <tr> <td>Optrekken met voetsteun</td> <td>Stang laag of bank onder je. Voeten op de bank, trek je op en help zo weinig mogelijk met je benen.</td> <td>3 x 5</td> <td>Sporthal: rekstok + bank</td> </tr> <tr> <td>Gebogen hang</td> <td>Stap via een bank omhoog tot je kin boven de stang is. Hou zo lang mogelijk vast.</td> <td>3 x zo lang mogelijk (doel 10–15 sec)</td> <td>Sporthal: rekstok + bank</td> </tr> <tr> <td>Negatieve optrekkingen</td> <td>Stap via een bank omhoog tot je kin boven de stang is. Zak in 3–5 tellen tot je armen gestrekt zijn.</td> <td>3 x 3–5</td> <td>Sporthal: rekstok + bank</td> </tr> <tr> <td>Optrekken met elastiek</td> <td>Elastiek rond de stang, voet of knie in de lus. Het elastiek helpt je onderaan. Dunner elastiek = zwaarder.</td> <td>3 x 3–6</td> <td>Sporthal: rekstok + weerstandselastiek (indien aanwezig)</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image2.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image2.png\" alt=\"Optrekken · 8 oefeningen, van makkelijk naar moeilijk\" loading=\"lazy\"></a><figcaption>Optrekken · 8 oefeningen, van makkelijk naar moeilijk</figcaption></figure> <p><strong>Veiligheid:</strong> leg altijd een mat onder de stang en laat je niet zomaar vallen. Gebruik thuis geen stang die je zelf in een deuropening klemt zonder dat ze goed vastzit.</p> <h2>3. Beenstretch L+R – norm: 90°, 5 tellen houden</h2> <p><strong>Eindvorm:</strong> één been tegen de muur, het andere been gestrekt langs de muur. Het been is horizontaal met de muur (90°) en raakt de muur niet. 5 tellen houden.</p> <p>Je hebt twee dingen nodig: een lenige achterkant van je been, en kracht om je been zelf omhoog te houden zonder steun.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Beenzwaaien</td> <td>Sta naast de muur, hand tegen de muur. Zwaai je gestrekte been gecontroleerd voor en achter, telkens iets hoger.</td> <td>2 x 10 per been</td> <td>Thuis &amp; sporthal – muur</td> </tr> <tr> <td>Liggende hamstringrek</td> <td>Lig op je rug, handdoek rond je voet. Trek het gestrekte been omhoog, het andere been ligt plat.</td> <td>3 x 30 sec per been</td> <td>Thuis &amp; sporthal – handdoek of springtouw</td> </tr> <tr> <td>Zittende voorwaartse plooi</td> <td>Zit met één been gestrekt, het andere gebogen. Breng je buik naar je knie met een rechte rug.</td> <td>3 x 30 sec per been</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Been op verhoging</td> <td>Hiel op een verhoging, been gestrekt. Buig met een rechte rug licht voorover.</td> <td>3 x 30 sec per been</td> <td>Thuis: stoel, trap – Sporthal: bank, wandrek</td> </tr> <tr> <td>Gestrekt been heffen in lig</td> <td>Lig op je rug, één been gebogen. Hef het andere gestrekte been traag omhoog en laat het traag zakken. Onderrug blijft plat.</td> <td>3 x 10 per been</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Zittende beenheffing</td> <td>Zit rechtop, benen gestrekt, handen naast je knieën. Til één gestrekt been een paar cm van de grond en hou 3–5 tellen.</td> <td>3 x 5 per been</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Steun loslaten</td> <td>Leg je been op een verhoging. Til het net boven de steun en hou 5 tellen zonder te zakken. Verhoging stap voor stap hoger.</td> <td>3 x 3 per been</td> <td>Thuis: stoel – Sporthal: bank, wandrek</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image3.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image3.png\" alt=\"Beenstretch · 7 oefeningen, eerst lenigheid, daarna kracht\" loading=\"lazy\"></a><figcaption>Beenstretch · 7 oefeningen, eerst lenigheid, daarna kracht</figcaption></figure> <p><strong>Veiligheid:</strong> hou je knie gestrekt, maar druk ze niet door. Niet verend rekken.</p> <h2>4. Spreidzit – norm: 120°</h2> <p><strong>Eindvorm:</strong> je zit rechtop op de grond met gestrekte benen zijwaarts gespreid. De hoek tussen je benen is 120°.</p> <p><strong>Zelf controleren:</strong> zit in de hoek van twee lijnen die een rechte hoek (90°) maken, met je benen langs de lijnen. Bij 120° ligt elk been nog een stukje (15°) buiten zijn lijn.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Vlinderzit</td> <td>Zit met je voetzolen tegen elkaar. Laat je knieën zakken, duw zacht met je ellebogen.</td> <td>3 x 30 sec</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Zijwaartse lunge</td> <td>Wijde stand. Buig één knie en schuif je gewicht naar die kant, het andere been blijft gestrekt.</td> <td>2 x 8 per kant</td> <td>Thuis &amp; sporthal – geen</td> </tr> <tr> <td>Sumo-zit</td> <td>Wijde stand, tenen naar buiten. Zak diep door je knieën en duw met je ellebogen je knieën open.</td> <td>3 x 30 sec</td> <td>Thuis &amp; sporthal – geen</td> </tr> <tr> <td>Muurspreid</td> <td>Lig op je rug, billen tegen de muur, benen gestrekt omhoog tegen de muur. Laat je benen langzaam openzakken.</td> <td>2–3 min</td> <td>Thuis &amp; sporthal – muur, mat</td> </tr> <tr> <td>Spreidzit voorover</td> <td>Zit in spreidzit, zo wijd als het gaat. Rechte rug, wandel met je handen naar voren. Daarna naar elk been.</td> <td>3 x 30 sec</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Kikkerhouding</td> <td>Op onderarmen en knieën, knieën wijd uit elkaar, enkels in lijn met je knieën. Schuif je heupen langzaam naar achter.</td> <td>3 x 30 sec</td> <td>Thuis &amp; sporthal – zachte mat (knieën!)</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image4.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image4.png\" alt=\"Spreidzit · 6 oefeningen en zelf controleren\" loading=\"lazy\"></a><figcaption>Spreidzit · 6 oefeningen en zelf controleren</figcaption></figure> <p><strong>Veiligheid:</strong> de lies is gevoelig. Bouw rustig op en laat nooit een medeleerling op je benen of rug duwen.</p> <h2>5. Plankhouding – norm: 2 minuten</h2> <p><strong>Eindvorm:</strong> 2 minuten plank op je onderarmen, ellebogen onder je schouders. Je lichaam is een rechte lijn: je heupen zakken niet en steken niet omhoog.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Bird dog</td> <td>Op handen en knieën. Strek tegelijk je linkerarm en rechterbeen, hou 3 tellen, wissel. Je rug blijft vlak.</td> <td>3 x 8 per kant</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Kniesteun-plank</td> <td>Plank op onderarmen en knieën, rechte lijn van knie tot hoofd.</td> <td>3 x 30–45 sec</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Plank op verhoging</td> <td>Onderarmen op een verhoging, voeten op de grond.</td> <td>3 x 30–60 sec</td> <td>Thuis: stoel, zetel – Sporthal: bank</td> </tr> <tr> <td>Dead bug</td> <td>Lig op je rug, armen omhoog, knieën 90° gebogen. Strek traag je linkerarm en rechterbeen uit, wissel. Onderrug blijft plat tegen de grond.</td> <td>3 x 10</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Zijplank</td> <td>Op één onderarm, op je zij, heupen hoog.</td> <td>3 x 20–30 sec per kant</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Hollow hold</td> <td>Lig op je rug, onderrug plat. Til schouders en gestrekte benen een beetje van de grond. Zwaarder: armen boven je hoofd.</td> <td>3 x 20 sec</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Plank in blokken</td> <td>Verdeel 2 minuten over een paar blokken met 30 sec rust: 4 x 30 sec → 3 x 40 sec → 2 x 60 sec → 1 x 2 min.</td> <td>1 keer de reeks</td> <td>Thuis &amp; sporthal – mat</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image5.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image5.png\" alt=\"Plankhouding · 7 oefeningen, van makkelijk naar moeilijk\" loading=\"lazy\"></a><figcaption>Plankhouding · 7 oefeningen, van makkelijk naar moeilijk</figcaption></figure> <p><strong>Tip:</strong> span je billen en buik aan, kijk naar de grond en adem rustig door. Doet je onderrug pijn of zakken je heupen? Stop het blok. Voeg elke week een beetje tijd toe (± 10 sec).</p> <h2>6. Hazensprong – norm: reeks over de lengte van een mat</h2> <p><strong>Eindvorm:</strong> hazensprongen na elkaar over de volledige lengte van een mat, zonder te stoppen. Zet je handen schouderbreed voor je op de mat, armen gestrekt. Zet af met beide voeten, breng je heupen hoog en land met je voeten bij je handen. Handen weer naar voren, enzovoort.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Polsen opwarmen</td> <td>Op handen en knieën. Maak cirkels met je polsen, draai daarna je vingers naar je knieën en leun zacht naar achter.</td> <td>1 min, altijd vooraf</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Gewicht op de handen</td> <td>Hurkzit, handen plat voor je. Schuif je gewicht naar voren tot je voeten even loskomen.</td> <td>3 x 8</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Beerloop</td> <td>Op handen en voeten, knieën net boven de grond. Wandel vooruit: linkerhand met rechtervoet en omgekeerd.</td> <td>3 x matlengte</td> <td>Thuis &amp; sporthal – mat of gras</td> </tr> <tr> <td>Hurksprongen</td> <td>Vanuit hurkzit explosief omhoog springen en zacht landen.</td> <td>3 x 8</td> <td>Thuis &amp; sporthal – geen</td> </tr> <tr> <td>Ezelstampen</td> <td>Handen op de mat, armen gestrekt. Zet af met beide voeten en breng je hielen naar je billen. Heupen boven je schouders.</td> <td>3 x 8</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Losse hazensprong</td> <td>Eén hazensprong over een lijn of touw op de grond. Sta recht en herbegin.</td> <td>3 x 5</td> <td>Sporthal: lijn, mat – Thuis: gras, tapijt</td> </tr> <tr> <td>Reeks met tussenstop</td> <td>3–4 hazensprongen na elkaar, kort stoppen, verder. Eerst over een halve mat, dan over de volledige.</td> <td>3 x matlengte</td> <td>Sporthal: mat</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image6.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image6.png\" alt=\"Hazensprong · 7 oefeningen, van makkelijk naar moeilijk\" loading=\"lazy\"></a><figcaption>Hazensprong · 7 oefeningen, van makkelijk naar moeilijk</figcaption></figure> <p><strong>Veiligheid:</strong> spring altijd op een mat of zachte ondergrond. Hou je armen gestrekt en je kin weg van je borst, zodat je niet op je hoofd of nek valt. Laat voldoende ruimte tussen jou en anderen.</p> <h2>7. Lenigheid schoudergordel – norm: 35°</h2> <p><strong>Eindvorm:</strong> je brengt een bezemsteel met gestrekte armen van voor je lichaam over je hoofd tot achter je en terug naar voren. De leerkracht schat de hoek in aan de hand van hoe je de steel vastneemt: hoe smaller je greep met gestrekte armen, hoe beter.</p> <p><strong>Zelf opvolgen:</strong> plak een stukje tape op de steel waar je handen zitten. Probeer de tape elke week een klein beetje naar binnen te schuiven.</p> <div class=\"tablewrap\"><table> <thead> <tr> <th>Oefening</th> <th>Zo doe je het</th> <th>Hoeveel</th> <th>Waar &amp; materiaal</th> </tr> </thead> <tbody> <tr> <td>Bovenrug openen</td> <td>Lig op je rug met een opgerolde handdoek dwars onder je schouderbladen. Armen boven je hoofd, ontspannen.</td> <td>1–2 min</td> <td>Thuis &amp; sporthal – handdoek, mat</td> </tr> <tr> <td>Borstrek</td> <td>Onderarm tegen een deurkozijn of muur, elleboog op schouderhoogte. Draai je lichaam rustig weg.</td> <td>3 x 30 sec per kant</td> <td>Thuis &amp; sporthal – muur</td> </tr> <tr> <td>Puppy-houding</td> <td>Op je knieën, armen gestrekt voor je op de grond. Laat je borst zakken, billen boven je knieën.</td> <td>3 x 30 sec</td> <td>Thuis &amp; sporthal – mat</td> </tr> <tr> <td>Muurengelen</td> <td>Rug, hoofd en armen tegen de muur, armen in een W. Schuif ze omhoog naar een Y zonder dat ze loskomen van de muur.</td> <td>2 x 10</td> <td>Thuis &amp; sporthal – muur</td> </tr> <tr> <td>Steel achter de rug</td> <td>Neem de steel achter je rug vast, armen gestrekt. Til de steel rustig naar achter en omhoog.</td> <td>3 x 20 sec</td> <td>Thuis: bezemsteel – Sporthal: stok</td> </tr> <tr> <td>Schouders doorhalen</td> <td>Neem een handdoek, elastiek of steel breed vast. Breng hem met gestrekte armen traag van voor naar achter en terug. Elke week 1–2 cm smaller vastnemen.</td> <td>3 x 10</td> <td>Thuis: handdoek, bezemsteel – Sporthal: stok, elastiek</td> </tr> </tbody> </table></div> <figure><a href=\"docs/oefenbundel/image7.png\" target=\"_blank\" rel=\"noopener\"><img src=\"docs/oefenbundel/image7.png\" alt=\"Schouderlenigheid · 6 oefeningen\" loading=\"lazy\"></a><figcaption>Schouderlenigheid · 6 oefeningen</figcaption></figure> <p><strong>Veiligheid:</strong> werk traag en zonder schokken, je armen blijven gestrekt. Pijn vooraan in je schouder? Neem de steel breder vast.</p> "]],"Oefenbundel");

/* Home: sporttegels zoals op de oorspronkelijke site */
const SPORTS = [
  ["zwemmen","zwemmen",[["3de jaar","zwem3"],["4de jaar","zwem4"]]],
  ["gymnastiek","gymnastiek",[["3de jaar","gym3"],["4de jaar"],["5de jaar","gym5"],["6de jaar"]]],
  ["balsporten","balsporten",[]],
  ["dans/atletiek","atletiek",[["3de jaar","atl3"]]],
  ["gevechtssport","gevechtssport",[["4de jaar","gv4"]]],
  ["basketbal","basketbal",[["4de jaar","bb4"],["5de jaar"],["6de jaar"]]],
  ["omnisport","omnisport",[["5de jaar","omni5"],["6de jaar"]]]
];

/* ===== Weergave ===== */
const framed = (()=>{try{return window.self!==window.top}catch(e){return true}})();
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kids = id=>Object.values(PAGES).filter(p=>p.p===id);
const trail = id=>{const a=[];let p=PAGES[id];while(p){a.unshift(p);p=PAGES[p.p];}return a;};
const PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg>';

function img(key, alt, deco){
  const src = IM[key].startsWith("img/") ? IM[key] : IMG + IM[key];
  const fail = deco ? "this.remove()" : "this.closest('.figure')?this.closest('.figure').remove():this.remove()";
  return `<img src="${esc(src)}" alt="${esc(alt||"")}" loading="lazy" onerror="${fail}">`;
}
function ext(f){const m=/\.([a-z0-9]+)$/i.exec(f);return m?m[1].toLowerCase():"";}
function block(b){
  switch(b[0]){
    case "h": return `<h3>${esc(b[1])}</h3>`;
    case "h2": return `<h2>${esc(b[1])}</h2>`;
    case "p": return `<div class="prose"><p>${esc(b[1])}</p></div>`;
    case "ul": return `<div class="prose"><ul>${b[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
    case "ol": return `<div class="prose"><ol>${b[1].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
    case "html": return `<div class="docbody">${b[1]}</div>`;
    case "attn": return `<div class="attn">${esc(b[1])}</div>`;
    case "img": return `<div class="figure">${img(b[1])}</div>`;
    case "links": return `<div class="linklist">${b[1].map(([l,to])=>to&&to.startsWith("docs/")?`<a class="pill dl" href="${esc(to)}" download>${esc(l)}</a>`:to&&PAGES[to]?`<a class="pill" href="#${to}">${esc(l)}</a>`:`<span class="pill off" title="Nog geen pagina">${esc(l)}</span>`).join("")}</div>`;
    case "v": {
      const [,label,file,drive]=b;
      const local = drive && drive.startsWith("video/");
      if(local) return `<div class="media"><div class="frame"><video src="${esc(drive)}" controls preload="metadata" playsinline></video></div><div class="meta"><b>${esc(label)}</b><span>${esc(file)}</span></div></div>`;
      const frame = drive && !framed
        ? `<iframe src="https://drive.google.com/file/d/${esc(drive)}/preview" allow="autoplay" allowfullscreen title="${esc(label)}"></iframe>`
        : PLAY;
      const act = drive ? `<a href="https://drive.google.com/file/d/${esc(drive)}/view" target="_blank" rel="noopener">Bekijk video op Drive</a>` : `<span>Video nog te koppelen</span>`;
      return `<div class="media"><div class="frame">${frame}</div><div class="meta"><b>${esc(label)}</b><span>${esc(file)}</span>${act}</div></div>`;
    }
    case "f": {
      const [,label,file,drive]=b;
      const act = drive && drive.startsWith("docs/") ? `<a href="${esc(drive)}" download>Downloaden</a>`
        : drive ? `<a href="https://drive.google.com/file/d/${esc(drive)}/view" target="_blank" rel="noopener">Openen</a>` : `<span>Bestand nog te koppelen</span>`;
      return `<div class="media doc"><div class="ico">${esc(ext(file)||"doc")}</div><div class="meta"><b>${esc(label)}</b><span>${esc(file)}</span>${act}</div></div>`;
    }
    case "s": return `<div class="media doc"><div class="ico">sheet</div><div class="meta"><b>${esc(b[1])}</b><span>Google Spreadsheet</span><a href="https://drive.google.com/open?id=${esc(b[2])}" target="_blank" rel="noopener">Openen in Google Sheets</a></div></div>`;
  }
  return "";
}
function renderBlocks(list){
  // opeenvolgende video's/bestanden samen in een raster
  let out="",buf=[];
  const flush=()=>{if(buf.length){out+=`<div class="grid">${buf.join("")}</div>`;buf=[];}};
  for(const b of list){ if(["v","f","s"].includes(b[0])) buf.push(block(b)); else {flush(); out+=block(b);} }
  flush(); return out;
}
function renderHome(){
  const years=[["3","3de-jaar"],["4","4de-jaar"],["5","5de-jaar"],["6",null]];
  return `<section class="hero">${img("hero","",true)}<div class="txt"><h1>Website Sportwetenschappen</h1><p>Oefeningen, demo's, prestatietabellen en afspraken voor het 3de tot 6de jaar sportwetenschappen.</p></div></section>
  <h2>Kies je jaar</h2>
  <div class="years">${years.map(([n,id])=>id?`<a class="year" href="#${id}"><b>${n}</b><span>${n}de jaar</span></a>`:`<div class="year off"><b>${n}</b><span>${n}de jaar · binnenkort</span></div>`).join("")}</div>
  <h2>Per sport</h2>
  <div class="sports">${SPORTS.map(([name,key,yrs])=>`<article class="sport"><div class="pic">${key?img(key,name,true):""}</div><div class="body"><h2>${esc(name)}</h2><div class="chips">${yrs.length?yrs.map(([l,to])=>to?`<a class="chip" href="#${to}">${esc(l)}</a>`:`<span class="chip off">${esc(l)}</span>`).join(""):`<span class="chip off">nog geen pagina's</span>`}</div></div></article>`).join("")}</div>`;
}
function renderPage(id){
  const p=PAGES[id]; const t=trail(id);
  const crumbs=t.slice(0,-1).map(x=>`<a href="#${x.id}">${esc(x.m)}</a><span>›</span>`).join("");
  let body=renderBlocks(p.c);
  const sub=kids(id);
  if(!p.c.some(b=>b[0]==="links") && sub.length) body+=`<div class="linklist">${sub.map(k=>`<a class="pill" href="#${k.id}">${esc(k.m)}</a>`).join("")}</div>`;
  if(!body) body=`<p class="empty">Deze pagina heeft nog geen inhoud.</p>`;
  return `<nav class="crumbs" aria-label="Kruimelpad">${crumbs}</nav><h1>${esc(p.t)}</h1>${body}`;
}
function renderTree(cur){
  const open=new Set(trail(cur).map(x=>x.id));
  const ul=(pid,lvl)=>{const k=kids(pid);if(!k.length)return"";return `<ul class="lvl${lvl}">${k.map(x=>`<li><a href="#${x.id}" class="${x.id===cur?"on":""}">${esc(x.m)}</a>${(open.has(x.id)||lvl===0&&false)?ul(x.id,lvl+1):""}</li>`).join("")}</ul>`;};
  document.getElementById("treeBody").innerHTML=`<ul class="lvl0"><li><a href="#home" class="${cur==="home"?"on":""}">Home</a></li></ul>`+ul("home",0);
}
function renderTopnav(cur){
  const top=trail(cur)[1]?.id;
  document.getElementById("topnav").innerHTML=[["home","Home"],["3de-jaar","3de jaar"],["4de-jaar","4de jaar"],["5de-jaar","5de jaar"]]
    .map(([id,l])=>`<a href="#${id}" class="${(id===top||(id==="home"&&cur==="home"))?"on":""}">${l}</a>`).join("");
}
function route(){
  let id=decodeURIComponent(location.hash.slice(1))||"home";
  if(!PAGES[id]) id="home";
  document.getElementById("main").innerHTML = id==="home"?renderHome():renderPage(id);
  renderTree(id); renderTopnav(id);
  document.title = id==="home"?"Website Sportwetenschappen":`${PAGES[id].t} · Website Sportwetenschappen`;
  document.getElementById("tree").classList.remove("open");
  document.getElementById("treeToggle").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.getElementById("treeToggle").addEventListener("click",e=>{
  const t=document.getElementById("tree"); t.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded",t.classList.contains("open"));
});
/* zoeken */
const zoek=document.getElementById("zoek"), res=document.getElementById("results");
zoek.addEventListener("input",()=>{
  const q=zoek.value.trim().toLowerCase();
  if(q.length<2){res.hidden=true;return;}
  const hits=Object.values(PAGES).filter(p=>p.id!=="home"&&(p.t+" "+p.m+" "+JSON.stringify(p.c)).toLowerCase().includes(q)).slice(0,30);
  res.innerHTML=hits.length?hits.map(p=>`<a href="#${p.id}">${esc(p.t)}<small>${trail(p.id).slice(1,-1).map(x=>esc(x.m)).join(" › ")}</small></a>`).join(""):`<a>Niets gevonden voor “${esc(q)}”</a>`;
  res.hidden=false;
});
res.addEventListener("click",()=>{res.hidden=true;zoek.value="";});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))res.hidden=true;});
route();
</script>
</body></html>
